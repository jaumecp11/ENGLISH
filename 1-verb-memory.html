<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Verb Memory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd36e; --bg2:#ff8fb1; --panel:#ffffffd9; --ink:#2b2350; --accent:#6c4cf5; --accent2:#ff5c8a;
  --good:#22c55e; --bad:#ef4444; --card:#fff; --radius:18px; --font:'Fredoka',system-ui,sans-serif; --border:4px solid #fff;
  --shadow:0 8px 0 rgba(43,35,80,.18), 0 14px 30px rgba(43,35,80,.18);
}
body.pixel{
  --bg1:#1b1f3b; --bg2:#2d1b4e; --panel:#0f1226; --ink:#f8f4e3; --accent:#ffd23f; --accent2:#3ee0cf;
  --card:#f8f4e3; --radius:0px; --font:'Press Start 2P',monospace; --border:4px solid #f8f4e3;
  --shadow:6px 6px 0 #000;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body:not(.pixel){ --panel:#ffffffe6; } }
:root[data-theme="dark"] body:not(.pixel){ --panel:#ffffffe6; }
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:linear-gradient(135deg,#ffd36e,#ff8fb1) fixed #ffb08f}
html.pixel{background:
  linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px) 0 0/24px 24px,
  linear-gradient(180deg,#1b1f3b,#2d1b4e) fixed #241d45}
body{font-family:var(--font);color:var(--ink);background:transparent;min-height:100vh;padding:16px;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:clamp(26px,5vw,44px);letter-spacing:.5px;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 18px rgba(0,0,0,.25)}
body.pixel h1{font-size:clamp(16px,3.6vw,28px);color:var(--accent);text-shadow:4px 4px 0 #000;line-height:1.4}
h1 small{display:block;font-size:.42em;letter-spacing:1px;opacity:.95;text-shadow:none;color:var(--ink)}
body:not(.pixel) h1 small{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
body.pixel .seg{border-radius:0;border:var(--border)}
.seg button{font-family:inherit;border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer}
body.pixel .seg button{border-radius:0;font-size:9px;padding:9px 10px}
.seg button.on{background:var(--accent);color:#fff}
body.pixel .seg button.on{color:#000}
.hud{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{flex:1 1 120px;background:var(--panel);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
body.pixel .stat{border:var(--border);font-size:12px}
.stat span.l{font-size:13px;opacity:.7;font-weight:600;display:block}
body.pixel .stat span.l{font-size:8px;margin-bottom:6px}
.stat .ic{font-size:26px}
body.pixel .stat .ic{font-size:18px}
.combo{color:var(--accent2)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6vw,16px);perspective:1200px}
.card{position:relative;aspect-ratio:1/1;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.card.flip{transform:rotateY(180deg)}
body.pixel .card{transition:transform .25s steps(4)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:var(--border);background:var(--card)}
.back{background:var(--card) center/cover no-repeat}
.back:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%)}
.card:not(.flip):not(.done):hover{transform:translateY(-6px) rotate(-1.5deg)}
.front{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;text-align:center}
.front img{width:100%;height:100%;object-fit:cover}
body.pixel .front img,body.pixel .back{image-rendering:pixelated}
.word{padding:8px;font-weight:700;font-size:clamp(16px,3.2vw,30px);line-height:1.15;color:var(--ink);background:radial-gradient(circle at 30% 20%,#fff,#efe9ff)}
body.pixel .word{background:#f8f4e3;color:#1b1f3b;font-size:clamp(8px,1.7vw,15px);line-height:1.7}
.word b{color:var(--accent2);display:block}
body.pixel .word b{color:#d6336c}
.word .ic{display:block;font-size:.9em;margin-bottom:4px;opacity:.6}
.card.done .face{border-color:var(--good);box-shadow:0 0 0 4px var(--good),var(--shadow)}
.card.done{animation:pop .6s ease}
.card.wrong .face{border-color:var(--bad)}
.card.wrong{animation:shake .45s}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-8px)}75%{transform:rotateY(180deg) translateX(8px)}}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;background:var(--panel);padding:14px 22px;border-radius:var(--radius);box-shadow:var(--shadow);font-weight:700;font-size:clamp(20px,4vw,34px);transition:.35s;z-index:20;text-align:center;max-width:90vw}
body.pixel .toast{border:var(--border);font-size:clamp(11px,2.4vw,18px);line-height:1.6}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast em{font-style:normal;color:var(--accent2)}
.overlay{position:fixed;inset:0;background:rgba(20,15,45,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.overlay.show{display:flex}
.win{background:#fff;border-radius:28px;padding:28px 24px;text-align:center;box-shadow:var(--shadow);max-width:420px;width:100%;animation:rise .6s cubic-bezier(.3,1.6,.5,1)}
body.pixel .win{border-radius:0;border:var(--border);background:#0f1226}
@keyframes rise{from{transform:translateY(40px) scale(.8);opacity:0}}
.win h2{font-size:36px;margin-bottom:6px}
body.pixel .win h2{font-size:18px;color:var(--accent);line-height:1.6}
.stars{font-size:52px;margin:10px 0;letter-spacing:6px}
body.pixel .stars{font-size:34px}
.win p{font-size:18px;margin:6px 0}
body.pixel .win p{font-size:10px;line-height:1.8}
.btn{font-family:inherit;margin-top:16px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:20px;padding:12px 26px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
body.pixel .btn{border-radius:0;color:#000;font-size:12px;box-shadow:4px 4px 0 #000}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.help{margin-top:14px;font-size:15px;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
body.pixel .help{font-size:8px;line-height:1.8;color:var(--ink)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:560px){.stat{font-size:16px}.stat .ic{font-size:20px}.seg button{padding:7px 10px;font-size:13px}}
</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <h1>Verb Memory<small>Action verbs · Present continuous</small></h1>
    <div class="controls">
      <div class="seg" id="styleSeg"><button data-v="cartoon" class="on">🎨 Cartoon</button><button data-v="pixel">👾 Pixel</button></div>
      <div class="seg" id="lvlSeg"><button data-v="1" class="on">1 · Verb</button><button data-v="2">2 · -ing</button><button data-v="3">3 · Sentence</button></div>
    </div>
  </header>
  <div class="hud">
    <div class="stat"><span class="ic">🃏</span><div><span class="l">Pairs</span><span id="pairs">0/8</span></div></div>
    <div class="stat"><span class="ic">👣</span><div><span class="l">Moves</span><span id="moves">0</span></div></div>
    <div class="stat"><span class="ic">⏱️</span><div><span class="l">Time</span><span id="time">0:00</span></div></div>
    <div class="stat"><span class="ic">🔥</span><div><span class="l">Score</span><span id="score">0</span> <span class="combo" id="combo"></span></div></div>
  </div>
  <div class="board" id="board"></div>
  <p class="help">Find the picture and the matching words. Tap a matched pair to hear it again! 🔊</p>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="over"><div class="win">
  <h2>Well done! 🎉</h2><div class="stars" id="stars"></div>
  <p id="sum"></p><button class="btn" id="again">Play again</button>
</div></div>

const VERBS = [{"base": "run", "ing": "running", "subj": "He", "be": "is "}, {"base": "jump", "ing": "jumping", "subj": "She", "be": "is "}, {"base": "swim", "ing": "swimming", "subj": "He", "be": "is "}, {"base": "eat", "ing": "eating", "subj": "She", "be": "is "}, {"base": "sleep", "ing": "sleeping", "subj": "He", "be": "is "}, {"base": "read", "ing": "reading", "subj": "She", "be": "is "}, {"base": "dance", "ing": "dancing", "subj": "He", "be": "is "}, {"base": "sing", "ing": "singing", "subj": "She", "be": "is "}];
let style='cartoon', level=1, first=null, lock=false, moves=0, pairs=0, score=0, combo=0, t0=0, timer=null;
const $=s=>document.querySelector(s);

// ---- sound ----
let ac;
function tone(f,d=.12,type='sine',v=.15,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=style==='pixel'?'square':type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+d)}catch(e){}}
const sFlip=()=>tone(520,.07,'triangle',.08);
const sGood=()=>{[660,880,1180].forEach((f,i)=>tone(f,.14,'sine',.12,i*.08))};
const sBad=()=>{tone(220,.18,'sawtooth',.06);tone(180,.22,'sawtooth',.06,.1)};
const sWin=()=>{[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.13))};
function say(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function label(v){
  if(level===1) return {html:`<b>${v.base}</b>`, speak:v.base};
  if(level===2) return {html:`<b>${v.ing}</b>`, speak:v.ing};
  return {html:`${v.subj} ${v.be}<b>${v.ing}</b>`, speak:`${v.subj} ${v.be} ${v.ing}`};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function build(){
  const b=$('#board');b.innerHTML='';first=null;lock=false;moves=pairs=score=combo=0;
  clearInterval(timer);t0=0;$('#time').textContent='0:00';upd();
  const deck=[];
  VERBS.forEach((v,i)=>{deck.push({id:i,kind:'img'});deck.push({id:i,kind:'txt'})});
  shuffle(deck).forEach(c=>{
    const v=VERBS[c.id], el=document.createElement('div');
    el.className='card';el.dataset.id=c.id;el.dataset.kind=c.kind;
    const front=c.kind==='img'?`<div class="face front"><img src="${IMGS[style][c.id]}" alt="${v.ing}"></div>`
      :`<div class="face front word"><div>${label(v).html}</div></div>`;
    el.innerHTML=`<div class="face back" style="background-image:url(${IMGS[style][8]})"></div>${front}`;
    el.onclick=()=>pick(el);b.appendChild(el);
  });
}
function upd(){$('#moves').textContent=moves;$('#pairs').textContent=pairs+'/8';$('#score').textContent=score;$('#combo').textContent=combo>1?'x'+combo:''}
function startTimer(){if(timer||t0)return;t0=Date.now();timer=setInterval(()=>{const s=(Date.now()-t0)/1000|0;$('#time').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0')},500)}
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1300)}

function pick(el){
  if(el.classList.contains('done')){say(label(VERBS[el.dataset.id]).speak);return}
  if(lock||el===first||el.classList.contains('flip'))return;
  startTimer();sFlip();el.classList.add('flip');
  if(el.dataset.kind==='txt') say(label(VERBS[el.dataset.id]).speak);
  if(!first){first=el;return}
  moves++;const a=first,b2=el;first=null;
  if(a.dataset.id===b2.dataset.id){
    combo++;pairs++;score+=100*combo;
    setTimeout(()=>{a.classList.add('done');b2.classList.add('done');sGood();const L=label(VERBS[a.dataset.id]);say(L.speak);toast(`✅ <em>${L.speak}</em>${combo>1?' · combo x'+combo+'!':''}`);burst(b2)},250);
    upd();if(pairs===8)setTimeout(win,1300);
  }else{
    combo=0;lock=true;upd();
    setTimeout(()=>{a.classList.add('wrong');b2.classList.add('wrong');sBad()},350);
    setTimeout(()=>{a.classList.remove('flip','wrong');b2.classList.remove('flip','wrong');lock=false},1100);
  }
}
function win(){
  clearInterval(timer);timer=null;sWin();
  const s=Math.round((Date.now()-t0)/1000), st=moves<=11?3:moves<=16?2:1;
  $('#stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('#sum').innerHTML=`${moves} moves · ${s}s · <b>${score}</b> points`;
  $('#over').classList.add('show');rain();
}
$('#again').onclick=()=>{$('#over').classList.remove('show');build()};
function seg(id,cb){document.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll(id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v)})}
seg('#styleSeg',v=>{style=v;document.body.classList.toggle('pixel',v==='pixel');document.documentElement.classList.toggle('pixel',v==='pixel');build()});
seg('#lvlSeg',v=>{level=+v;build()});

// ---- particles ----
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COLS=()=>style==='pixel'?['#ffd23f','#3ee0cf','#ff5c8a','#f8f4e3']:['#6c4cf5','#ff5c8a','#ffd36e','#22c55e','#38bdf8'];
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<26;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*9,vy:(Math.random()-.9)*9,s:4+Math.random()*6,c:COLS()[i%COLS().length],l:60});loop()}
function rain(){for(let i=0;i<160;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,c:COLS()[i%COLS().length],l:220});loop()}
let running=false;function loop(){if(running)return;running=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,style==='pixel'?p.s:p.s*.6)});if(parts.length)requestAnimationFrame(f);else{running=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
build();
</script>

<script id="fitwjs">(function(){
function fit(el){el.style.fontSize='';const base=parseFloat(getComputedStyle(el).fontSize)||20;let s=base;
 const over=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;
 if(!el.clientWidth)return;while(over()&&s>9){s-=1;el.style.fontSize=s+'px'}}
let q=false;function all(){q=false;document.querySelectorAll('.word').forEach(fit)}
function sched(){if(!q){q=true;requestAnimationFrame(all)}}
new MutationObserver(m=>{if(m.some(x=>x.type==='childList'))sched()}).observe(document.body,{childList:true,subtree:true});
addEventListener('resize',sched);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);sched();
})();</script>
