<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Crystal Ball Future</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7efff;--muted:#c9b6f0;--gold:#ffd166;--pink:#ff7ad9;--cy:#7ef0ff;--good:#3ee08a;--bad:#ff5d73;--card:rgba(40,20,80,.75)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#12062b}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:14px 16px 30px;overflow-x:hidden;background:radial-gradient(ellipse at 50% 30%,#3b1a78 0,#1d0b45 45%,#0d041f 100%) fixed #12062b}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 80% 15%,#fff,transparent),radial-gradient(1px 1px at 60% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 80%,#fff,transparent),radial-gradient(1px 1px at 15% 85%,#fff,transparent),radial-gradient(2px 2px at 45% 10%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.wrap{max-width:1050px;margin:0 auto;position:relative}
header{text-align:center;margin-bottom:8px}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,4.8vw,46px);color:var(--gold);text-shadow:0 0 20px rgba(255,209,102,.6),0 3px 0 #7a3cc9}
h1 small{display:block;font-family:'Fredoka';font-size:.38em;color:var(--muted);text-shadow:none;margin-top:4px}
.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.hud div{background:var(--card);border:2px solid #6b44c2;border-radius:999px;padding:4px 14px;font-weight:600}
.hud b{color:var(--gold)}
.stage{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.1fr);gap:22px;align-items:center}
.ballbox{position:relative;display:flex;flex-direction:column;align-items:center}
.teller{font-size:64px;margin-bottom:-24px;z-index:3;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.ball{position:relative;width:min(80vw,380px);aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;box-shadow:0 0 50px 10px rgba(126,240,255,.35),0 0 120px 20px rgba(255,122,217,.25),inset 0 0 40px rgba(255,255,255,.4);z-index:2;background:#2a1260}
.ball img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;transition:filter .4s linear,opacity .6s;filter:blur(30px) saturate(1.3);opacity:0}
.ball .fog{position:absolute;inset:-30%;background:radial-gradient(circle at 30% 40%,rgba(220,200,255,.85),transparent 40%),radial-gradient(circle at 70% 60%,rgba(255,180,240,.8),transparent 45%),radial-gradient(circle at 50% 50%,rgba(160,230,255,.7),transparent 50%);animation:swirl 6s linear infinite;transition:opacity 1s}
@keyframes swirl{to{transform:rotate(360deg)}}
.ball .shine{position:absolute;top:8%;left:16%;width:34%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85),transparent 70%);transform:rotate(-25deg);pointer-events:none}
.ball .ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25),inset 0 -30px 60px rgba(40,0,80,.6);pointer-events:none}
.ball.shake{animation:shk .7s}
@keyframes shk{20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.base{width:min(56vw,260px);height:56px;margin-top:-26px;background:linear-gradient(180deg,#e0a93a,#9b6a12);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:0 0 12px 12px;box-shadow:0 10px 20px rgba(0,0,0,.5);z-index:1}
.panel{background:var(--card);border:2px solid #6b44c2;border-radius:24px;padding:18px;backdrop-filter:blur(6px);min-height:300px}
.panel .tag{display:inline-block;background:#2a1260;color:var(--cy);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px;margin-bottom:8px}
.panel h2{font-size:clamp(21px,3vw,29px);line-height:1.2;margin-bottom:8px}
.panel h2 .bl{display:inline-block;min-width:80px;border-bottom:3px dashed var(--muted)}
.panel p{color:var(--muted);font-size:17px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt,.btn,.tile{font:600 clamp(16px,2.3vw,20px) 'Fredoka';border:0;border-radius:14px;padding:11px 12px;cursor:pointer;color:#fff;background:#5a2fb0;box-shadow:0 4px 0 #34187a}
.opt:hover,.tile:hover{background:#6c3bd0}
.opt.ok,.tile.ok{background:var(--good);color:#073b20;box-shadow:0 4px 0 #1b8a52}
.opt.no{background:var(--bad)}
.btn{background:linear-gradient(180deg,#ffd166,#f2a516);color:#3a1c00;box-shadow:0 5px 0 #a86f00;font-size:21px;padding:12px 26px;margin-top:12px}
.btn:active,.opt:active,.tile:active{transform:translateY(3px);box-shadow:none}
.timerbar{height:10px;border-radius:9px;background:#2a1260;overflow:hidden;margin:6px 0 4px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pink));width:100%}
.answer{min-height:58px;border:2px dashed #8a64dc;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{padding:8px 14px;background:#7a43e0}
.answer .tile{background:#ffd166;color:#3a1c00;box-shadow:0 4px 0 #a86f00}
.answer.ok{border-color:var(--good);background:rgba(62,224,138,.15)}
.answer.no{border-color:var(--bad);animation:shk .5s}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{font:600 15px 'Fredoka';background:transparent;color:var(--muted);border:2px solid #6b44c2;border-radius:10px;padding:6px 10px;cursor:pointer}
.mode{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.mode button{font:600 14px 'Fredoka';background:var(--card);color:var(--ink);border:2px solid #6b44c2;border-radius:999px;padding:5px 12px;cursor:pointer}
.mode button.on{background:var(--gold);color:#3a1c00;border-color:var(--gold)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:760px){.stage{grid-template-columns:1fr;gap:12px}.teller{font-size:48px;margin-bottom:-18px}.ball{width:min(72vw,300px)}.panel{min-height:0}}
</style>
<div class="stars"></div>
<canvas id="fx"></canvas>
<div class="wrap">
 <header><h1>🔮 Crystal Ball Future<small>Unit 5 · At the TV studio · will / won’t · jobs</small></h1>

 </header>

let ac;function tone(f,d=.12,v=.1,w=0,t='sine'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d)}catch(e){}}
const sMagic=()=>[880,1175,1568,2093,1568,2349].forEach((f,i)=>tone(f,.25,.05,i*.07)),sGood=()=>[784,988,1318].forEach((f,i)=>tone(f,.18,.09,i*.08)),sBad=()=>tone(180,.35,.08,0,'sawtooth'),sWin=()=>[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.3,.09,i*.12,'triangle'));
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/’/g,"'"));u.lang='en-GB';u.rate=.9;u.pitch=1.1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function hud(){$('#rnd').textContent=Math.min(rnd,10)+'/10';$('#pts').textContent=pts;$('#stk').textContent=stk}
function setVis(i,blur,show=true){const v=$('#vis');v.src=IMG[i];v.style.filter=`blur(${blur}px) saturate(1.3)`;v.style.opacity=show?1:0;$('#fog').style.opacity=blur>12?.85:blur>4?.4:0}
function hide(){$('#vis').style.opacity=0;$('#fog').style.opacity=1}
function intro(){
 rnd=0;pts=0;stk=0;hud();hide();
 $('#panel').innerHTML=`<span class="tag">✨ Madame Fortuna</span><h2>Welcome, young friend! I can see the future… 🔮</h2><p>Touch the crystal ball to see what people <b>will</b> be in the future. Answer my questions with <b>will</b> and <b>won’t</b> to win magic points!</p><button class="btn" id="go">Look into the ball ✨</button>`;
 $('#go').onclick=nextRound;
}
function nextRound(){
 clearInterval(timer);busy=false;
 if(rnd>=10)return finale();rnd++;hud();
 const t=mode==='mix'?['guess','yn','build'][(rnd-1)%3]:mode;
 const k=Math.random()*9|0,J=JOBS[k],name=pick(NAMES[J.p]);
 $('#ball').classList.remove('shake');void $('#ball').offsetWidth;$('#ball').classList.add('shake');sMagic();hide();
 setTimeout(()=>({guess,yn,build})[t](k,J,name),700);
}
function done(ok,sentence,bonus=0){
 if(ok){stk++;pts+=100+bonus+stk*10;sGood();burst()}else{stk=0;sBad()}
 hud();say(sentence);
 const b=document.createElement('button');b.className='btn';b.textContent=rnd>=10?'See my future ✨':'Next fortune 🔮';b.onclick=nextRound;
 const p=document.createElement('p');p.style.marginTop='10px';p.innerHTML=`${ok?'✅':'💡'} <b style="color:var(--ink)">${sentence}</b>`;
 $('#panel').append(p,b);
}
// 1) guess the job while the fog clears
function guess(k,J,name){
 let blur=26;setVis(k,blur);
 const opts=shuffle([k,...shuffle([0,1,2,3,4,5,6,7,8].filter(x=>x!==k)).slice(0,3)]);
 const pr=J.p,sentence=`${name} will be ${J.a} ${J.j}.`;
 $('#panel').innerHTML=`<span class="tag">👁️ Guess the job · ${name} ${pr==='he'?'👦':'👧'}</span><h2>In the future, ${name} will be <span class="bl"></span></h2><p>The fog is clearing… answer fast for more points!</p><div class="timerbar"><i id="tb"></i></div><div class="opts">${opts.map(i=>`<button class="opt" data-i="${i}">${JOBS[i].a} ${JOBS[i].j}</button>`).join('')}</div>`;
 let t=100;timer=setInterval(()=>{t-=1.2;blur=Math.max(0,26*t/100);setVis(k,blur);$('#tb').style.width=Math.max(0,t)+'%';if(t<=0)clearInterval(timer)},100);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;clearInterval(timer);setVis(k,0);
  const ok=+b.dataset.i===k;b.classList.add(ok?'ok':'no');if(!ok)document.querySelector(`.opt[data-i="${k}"]`).classList.add('ok');
  done(ok,sentence,ok?Math.round(Math.max(0,t)):0)});
}
// 2) Will …? yes/no
function yn(k,J,name){
 setVis(k,0);const yes=Math.random()<.5,k2=yes?k:pick([0,1,2,3,4,5,6,7,8].filter(x=>x!==k)),J2=JOBS[k2];
 const pr=J.p,q=`Will ${name} be ${J2.a} ${J2.j}?`;
 const ans=yes?`Yes, ${pr} will.`:`No, ${pr} won’t.`;
 const opts=shuffle(yes?[ans,`Yes, ${pr} won’t.`,`No, ${pr} won’t.`,`Yes, ${pr} is.`]:[ans,`No, ${pr} will.`,`Yes, ${pr} will.`,`No, ${pr} doesn’t.`]);
 $('#panel').innerHTML=`<span class="tag">❓ Will…? · look at the ball</span><h2>“${q}”</h2><p>Look carefully at ${name}’s future in the crystal ball.</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
 say(q);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const ok=b.textContent===ans;b.classList.add(ok?'ok':'no');if(!ok)[...document.querySelectorAll('.opt')].find(x=>x.textContent===ans).classList.add('ok');
  done(ok,`${q} ${ans}${yes?'':` ${cap(pr)}’ll be ${J.a} ${J.j}.`}`)});
}
// 3) build the prediction
function build(k,J,name){
 setVis(k,0);let words,sent;const r=Math.random();
 if(r<.4){words=[name,'will','be',J.a,...J.j.split(' ')];sent=words.join(' ')+'.'}
 else if(r<.7){const [m,act]=pick(NEGACT);words=[cap(J.p),m,...act.split(' ')];sent=words.join(' ')+'.'}
 else{words=['Will',name,'be',J.a,...J.j.split(' ')];sent=words.join(' ')+'?'}
 const distract=pick(r<.4||r>=.7?['is','won’t','be','going']:['will','is','does']);
 const pool=shuffle([...words.map((w,i)=>({w,i})),{w:distract,i:-1}]);let chosen=[];
 $('#panel').innerHTML=`<span class="tag">🧩 Build the prediction · ${name} ${J.p==='he'?'👦':'👧'}</span><h2>Put the words in order${sent.endsWith('?')?' to make a question':''}!</h2><p>${sent.endsWith('?')?'Ask Madame Fortuna about the picture. (One word is extra!)':'Make Madame Fortuna’s prediction. (One word is extra!)'}</p><div class="answer" id="ansb"></div><div class="pool" id="pool"></div><div class="tools"><button id="undo">↩️ Undo</button><button id="chk" style="border-color:var(--gold);color:var(--gold)">✔ Check</button></div>`;
 function draw(){$('#ansb').innerHTML=chosen.map(c=>`<button class="tile">${c.w}</button>`).join('')+`<span style="font-size:22px;color:var(--muted)">${sent.slice(-1)}</span>`;
  $('#pool').innerHTML=pool.map((c,i)=>chosen.includes(c)?'':`<button class="tile" data-i="${i}">${c.w}</button>`).join('');
  document.querySelectorAll('#pool .tile').forEach(b=>b.onclick=()=>{if(busy)return;chosen.push(pool[+b.dataset.i]);tone(600+chosen.length*60,.06,.06);draw()});
  document.querySelectorAll('#ansb .tile').forEach((b,i)=>b.onclick=()=>{if(busy)return;chosen.splice(i,1);draw()})}
 draw();$('#undo').onclick=()=>{if(!busy){chosen.pop();draw()}};
 $('#chk').onclick=()=>{if(busy)return;const got=chosen.map(c=>c.w).join(' ');const ok=got===words.join(' ');
  if(!ok&&chosen.length<words.length){$('#ansb').classList.remove('no');void $('#ansb').offsetWidth;$('#ansb').classList.add('no');tone(220,.15,.06);return}
  busy=true;$('#ansb').classList.add(ok?'ok':'no');if(!ok){$('#ansb').innerHTML=words.map(w=>`<button class="tile ok">${w}</button>`).join('')+sent.slice(-1)}done(ok,sent)};
}
function finale(){hide();sWin();rain();
 const rank=pts>=1700?'🌟 Grand Wizard of the Future':pts>=1100?'🔮 Fortune Teller':'✨ Apprentice';
 const myjob=pick(JOBS);
 $('#panel').innerHTML=`<span class="tag">✨ The end</span><h2>${rank}</h2><p style="font-size:20px">Magic points: <b style="color:var(--gold)">${pts}</b></p><p style="margin-top:10px">Madame Fortuna says: “In the future, <b style="color:var(--ink)">you will be ${myjob.a} ${myjob.j}</b>… and you <b style="color:var(--ink)">won’t</b> forget your English!” 😉</p><button class="btn" id="re">Play again 🔮</button>`;
 setTimeout(()=>setVis(JOBS.indexOf(myjob),0),600);$('#re').onclick=intro;say(`In the future, you will be ${myjob.a} ${myjob.j}!`)}
$('#ball').onclick=()=>{if(!rnd&&$('#go'))nextRound()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;intro()});
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COL=['#ffd166','#ff7ad9','#7ef0ff','#ffffff','#b48cff'];
function star(x,y,s,c){cx.fillStyle=c;cx.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.4:s,a=i*Math.PI/4;cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.fill()}
function burst(){const r=$('#ball').getBoundingClientRect();for(let i=0;i<40;i++){const a=Math.random()*6.28,s=2+Math.random()*7;parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:3+Math.random()*6,c:COL[i%5],l:60,g:0})}loop()}
function rain(){for(let i=0;i<160;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:4+Math.random()*6,c:COL[i%5],l:240,g:.05});loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;star(p.x,p.y,p.s,p.c)});if(parts.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
intro();
</script>
