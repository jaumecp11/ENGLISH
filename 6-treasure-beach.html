<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Treasure Beach</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2410;--sand:#f3d39a;--sand2:#e8bf78;--wet:#c9995a;--sea:#2bb3d9;--sea2:#127fb0;--good:#1fb36b;--bad:#e5484d;--card:#fffaf0}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#f3d39a}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#7fd7f5 0,#bfeeff 120px,var(--sea) 121px,var(--sea2) 190px,#f7e2b5 191px,var(--sand) 100%) #f3d39a}
.waves{position:absolute;left:0;right:0;top:170px;height:40px;background:radial-gradient(circle at 20px -6px,transparent 22px,#f7e2b5 23px) 0 0/40px 40px repeat-x;animation:wave 6s linear infinite;opacity:.95}
@keyframes wave{to{background-position:40px 0}}
.wrap{max-width:1080px;margin:0 auto;padding:12px 16px 30px;position:relative}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;min-height:150px}
h1{font-size:clamp(30px,5.4vw,52px);color:#fff;text-shadow:0 4px 0 #0d6e98,0 8px 18px rgba(0,0,0,.25);line-height:1}
h1 small{display:block;font-size:.36em;color:#063b52;text-shadow:none;margin-top:6px;font-weight:700}
.seg{display:flex;background:rgba(255,255,255,.85);border-radius:999px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.seg button{font:700 15px 'Baloo 2';border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.seg button.on{background:#ff8a3d;color:#fff}
.hud{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.hud div{background:var(--card);border-radius:16px;padding:6px 14px;font-weight:800;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hud div.cur{outline:4px solid #ff8a3d}
.main{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:14px;border-radius:26px;background:var(--sand2);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 10px 0 rgba(120,80,30,.25)}
.tile{position:relative;aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;font:800 clamp(16px,2.6vw,28px) 'Baloo 2';color:var(--ink);background:radial-gradient(circle at 30% 30%,#fff2cf 0 6%,transparent 7%),radial-gradient(circle at 70% 65%,#e7c07f 0 5%,transparent 6%),radial-gradient(circle at 45% 80%,#fff2cf 0 4%,transparent 5%),linear-gradient(145deg,#f9e2b0,#eac586);box-shadow:0 5px 0 #c99a55;transition:transform .12s}
.tile:hover:not(.dug){transform:translateY(-3px) rotate(-2deg)}
.tile.dug{cursor:default;box-shadow:inset 0 6px 12px rgba(0,0,0,.35);background:var(--wet)}
.tile .h{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tile .h small{font-size:.42em;font-weight:700}
.h0{background:linear-gradient(135deg,#ffd84d,#ff9f1c)!important;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 30px 8px #ffd84d}}
.h1{background:#ff5a3c!important;color:#fff}.h2{background:#ff9d4d!important}.h3{background:#ffe08a!important}.h4{background:#9fd8f5!important}
.tile.dig{animation:dig .5s}
@keyframes dig{30%{transform:scale(.85) rotate(8deg)}60%{transform:scale(1.08) rotate(-6deg)}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.15);font-size:16px}
.card h3{font-size:19px;margin-bottom:6px}
.key div{display:flex;align-items:center;gap:8px;margin:3px 0;font-weight:700}
.key i{width:26px;height:20px;border-radius:6px;display:inline-block}
.log{font-size:15px;max-height:170px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(10,50,70,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.show{display:flex}
.q{background:var(--card);border-radius:26px;max-width:540px;width:100%;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-height:94vh;overflow:auto;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.q img{width:100%;max-width:330px;border-radius:18px;aspect-ratio:1/0.72;object-fit:cover;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.q .tag{display:inline-block;background:#ffe2c7;border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;margin-bottom:8px}
.q h2{font-size:clamp(20px,3.6vw,27px);line-height:1.2;margin:8px 0}
.q h2 .bl{display:inline-block;min-width:70px;border-bottom:3px dashed #b58a52}
.q .big{font-size:70px;line-height:1}
.opts{display:grid;gap:8px;margin-top:8px}
.opt,.btn{font:700 clamp(17px,2.6vw,21px) 'Baloo 2';border:0;border-radius:14px;padding:10px 14px;cursor:pointer;color:var(--ink);background:#e2f5fc;box-shadow:0 4px 0 #a8d6e8}
.opt.ok{background:var(--good);color:#fff;box-shadow:0 4px 0 #13774a}.opt.no{background:var(--bad);color:#fff;box-shadow:0 4px 0 #9e2125}
.btn{background:#ff8a3d;color:#fff;box-shadow:0 5px 0 #c05a17;margin-top:10px}
.crab{position:fixed;bottom:10px;font-size:40px;animation:crab 18s linear infinite;pointer-events:none;z-index:5}
@keyframes crab{0%{left:-60px}100%{left:110%}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:820px){.main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(5,1fr);padding:9px;gap:6px}.side{flex-direction:row;flex-wrap:wrap}.side .card{flex:1 1 220px}header{min-height:0;margin-bottom:40px}}
</style>
<canvas id="fx"></canvas>
<div class="waves"></div>
<div class="crab">🦀</div>
<div class="wrap">
 <header>
  <h1>🏴‍☠️ Treasure Beach<small>Unit 4 · At the coast · past simple</small></h1>
  <div class="seg" id="mode"><button data-v="1" class="on">🧒 1 player</button><button data-v="2">👥 2 teams</button></div>
 </header>
 <div class="hud" id="hud"></div>
 <div class="main">
  <div class="grid" id="grid"></div>
  <div class="side">
   <div class="card key"><h3>🌡️ Treasure detector</h3><div><i style="background:#ff5a3c"></i>🔥 Very hot (1 step)</div><div><i style="background:#ff9d4d"></i>♨️ Hot (2 steps)</div><div><i style="background:#ffe08a"></i>🌤️ Warm (3 steps)</div><div><i style="background:#9fd8f5"></i>❄️ Cold (far!)</div></div>
   <div class="card"><h3>📜 Explorer’s diary</h3><div class="log" id="log">Answer in the past simple to dig! ⛏️</div></div>
  </div>
 </div>
</div>
<div class="modal" id="modal"><div class="q" id="q"></div></div>

const NEG=[['She did not ___ a bottle of water.','buy',['bought','buys']],['We did not ___ the planetarium.','visit',['visited','visits']],['You did not ___ shells.','collect',['collected','collecting']],['I did not ___ a shark.','see',['saw','sees']],['They did not ___ fish and chips.','eat',['ate','eats']],['He did not ___ his phone. 📱','find',['found','finds']]];
const QUES=[['“What ___ you see?” “I saw a snake.”','did',['do','saw']],['“Who did she ___?” “She met some friends.”','meet',['met','meets']],['“How many shells ___ they find?” “They found 25.”','did',['do','found']],['“What did you ___?” “I bought a T-shirt.”','buy',['bought','buys']],['“___ you go karting?” “Yes, I did!”','Did',['Do','Were']],['“Did they visit the aquarium?” “Yes, they ___.”','did',['do','visited']],['“Did you swim in the sea?” “No, I ___.”','did not',['do not','was not']]];
const TALK=[['“How long were you there for?”','I was there for two hours.',['I were there for two hours.','I am there for two hours.']],['“How long was your journey?”','It was three hours.',['It were three hours.','It is three hours ago.']],['“How old do you have to be to go on this ride?” 🎢','You have to be twelve years old.',['You has to be twelve years old.','You have be twelve years old.']],['“I am ten. Can I go on the roller coaster?”','Sorry, you are not old enough.',['Sorry, you are not enough old.','Sorry, you is not old enough.']],['“I am fourteen. Can I go karting?”','Yes, you are old enough.',['Yes, you are enough old.','Yes, you old enough.']]];
const FINDS=[['🦴','some fossils','Fossils! +1 shovel ⛏️',{sh:1}],['🦕','a dinosaur bone','A dinosaur bone! +200 ⭐',{pts:200}],['🐍','a snake','A snake! Run! −1 shovel',{sh:-1}],['🟫','some mud','Yuck! Mud! Nothing happens.',{}],['🌪️','a sandstorm','A sandstorm! Some holes are covered again!',{storm:1}],['🐉','a toy dragon','A toy dragon! +100 ⭐',{pts:100}]];
const $=s=>document.querySelector(s);const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};const pick=a=>a[Math.random()*a.length|0];
let C=7,R=5,tr,dug,players,cur,mode=1,over;
let ac;function tone(f,d=.12,v=.1,w=0,t='triangle'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d)}catch(e){}}
const sDig=()=>{for(let i=0;i<4;i++)tone(120+Math.random()*80,.08,.12,i*.07,'sawtooth')},sGood=()=>[660,880,1100].forEach((f,i)=>tone(f,.14,.1,i*.08,'sine')),sBad=()=>tone(170,.3,.09,0,'sawtooth'),sWin=()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.2,.1,i*.13));
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/[“”]/g,''));u.lang='en-GB';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function log(h){$('#log').insertAdjacentHTML('afterbegin',`<div>• ${h}</div>`)}
function cols(){return innerWidth<=820?5:7}
function newGame(){C=cols();R=C===7?5:7;tr=Math.random()*C*R|0;dug={};over=false;
 players=mode===1?[{n:'🧒 You',pts:0,sh:10}]:[{n:'🔵 Team A',pts:0,sh:99},{n:'🔴 Team B',pts:0,sh:99}];cur=0;$('#log').innerHTML='';log('Answer in the past simple to dig! ⛏️');draw()}
function draw(){
 $('#hud').innerHTML=players.map((p,k)=>`<div class="${k===cur&&players.length>1?'cur':''}">${p.n} · ⭐ ${p.pts}${mode===1?` · ⛏️ ${p.sh}`:''}</div>`).join('');
 const g=$('#grid');g.style.gridTemplateColumns=`repeat(${C},1fr)`;g.innerHTML='';
 for(let i=0;i<C*R;i++){const b=document.createElement('button');b.className='tile';b.dataset.i=i;
  if(dug[i]!==undefined){const d=dug[i];b.classList.add('dug','h'+Math.min(4,d.h));b.innerHTML=`<span class="h">${d.h===0?'💰':d.f?d.f:['','🔥','♨️','🌤️','❄️'][Math.min(4,d.h)]}<small>${d.h===0?'TREASURE':d.h<4?d.h+' step'+(d.h>1?'s':''):'cold'}</small></span>`}
  b.onclick=()=>tap(i,b);g.appendChild(b)}
}
function dist(i){return Math.abs(i%C-tr%C)+Math.abs((i/C|0)-(tr/C|0))}
function makeQ(){
 const r=Math.random();
 if(r<.3){const k=Math.random()*9|0,[c,w1,w2]=ACT[k];return {img:k,tag:'📸 What did they do?',h:`Last weekend they <span class="bl"></span>`,ans:c,opts:shuffle([c,w1,w2]),say:`Last weekend they ${c}.`}}
 if(r<.4){const k=Math.random()*9|0,yes=Math.random()<.5,k2=yes?k:(k+1+Math.random()*8|0)%9;return {img:k,tag:'📸 Look at the photo',h:`“Did they ${BASEQ[k2]}?”`,ans:yes?'Yes, they did.':'No, they did not.',opts:shuffle(yes?['Yes, they did.','Yes, they do.','No, they did not.']:['No, they did not.','No, they do not.','Yes, they did.']),say:`Did they ${BASEQ[k2]}? ${yes?'Yes, they did.':'No, they did not.'}`}}
 if(r<.65){const [s,b,a,w]=pick(IRR);return {tag:'🔤 Irregular verbs',h:s.replace('___','<span class="bl"></span>')+` <small>(${b})</small>`,ans:a,opts:shuffle([a,...w]),say:s.replace('___',a)}}
 if(r<.77){const [s,a,w]=pick(NEG);return {tag:'🚫 Negative',h:s.replace('___','<span class="bl"></span>'),ans:a,opts:shuffle([a,...w]),say:s.replace('___',a)}}
 if(r<.9){const [s,a,w]=pick(QUES);return {tag:'❓ Questions',h:s.replace('___','<span class="bl"></span>'),ans:a,opts:shuffle([a,...w]),say:s.replace('___',a)}}
 const [s,a,w]=pick(TALK);return {tag:'💬 Language in action',h:s,ans:a,opts:shuffle([a,...w]),say:s+' '+a}
}
function tap(i,b){if(over||dug[i]!==undefined)return;const P=players[cur];if(P.sh<=0)return;
 const Q=makeQ();
 $('#q').innerHTML=`<span class="tag">${Q.tag}</span>${Q.img!==undefined?`<br><img src="${IMG[Q.img]}" alt="">`:'<div class="big">⛏️</div>'}<h2>${Q.h}</h2><div class="opts">${Q.opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
 $('#modal').classList.add('show');
 document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(o.disabled)return;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  const ok=o.textContent===Q.ans;say(Q.say);
  if(ok){o.classList.add('ok');sGood();P.pts+=100}else{o.classList.add('no');sBad();[...document.querySelectorAll('.opt')].find(x=>x.textContent===Q.ans).classList.add('ok');if(mode===1)P.sh--}
  setTimeout(()=>{$('#modal').classList.remove('show');if(ok)dig(i);else{log(`❌ ${Q.say}`);next()}},1700)});
}
function dig(i){
 const P=players[cur];if(mode===1)P.sh--;sDig();const h=dist(i);
 let f=null;if(h>0&&Math.random()<.22){f=pick(FINDS)}
 dug[i]={h,f:f?f[0]:null};draw();const el=document.querySelector(`.tile[data-i="${i}"]`);el.classList.add('dig');
 if(h===0){P.pts+=1000;draw();burst(el);return setTimeout(win,600)}
 log(`⛏️ ${['','🔥 Very hot!','♨️ Hot!','🌤️ Warm.','❄️ Cold.'][Math.min(4,h)]}`);
 if(f){const e=f[3];setTimeout(()=>{
   $('#q').innerHTML=`<div class="big">${f[0]}</div><h2>You found ${f[1]}!</h2><p style="font-size:19px">${f[2]}</p><button class="btn" id="ok">OK</button>`;$('#modal').classList.add('show');say(`You found ${f[1]}!`);
   $('#ok').onclick=()=>{$('#modal').classList.remove('show');if(e.sh)P.sh=Math.max(0,P.sh+e.sh);if(e.pts)P.pts+=e.pts;if(e.storm){Object.keys(dug).filter(k=>+k!==i).sort(()=>Math.random()-.5).slice(0,2).forEach(k=>delete dug[k])}log(`${f[0]} ${f[1]}`);next()}},500);return}
 next();
}
function next(){const P=players[cur];if(mode===1&&P.sh<=0){draw();return lose()}if(players.length>1)cur=1-cur;draw()}
function win(){over=true;sWin();rain();const P=players[cur];
 const champ=players.length>1?[...players].sort((a,b)=>b.pts-a.pts)[0]:P;
 $('#q').innerHTML=`<div class="big">💰🏴‍☠️</div><h2>${P.n} found the treasure!</h2><p style="font-size:20px">${players.map(p=>`${p.n}: ⭐ ${p.pts}`).join('<br>')}</p>${players.length>1?`<h2>🏆 ${champ.n} win${champ.n.includes('You')?'':'s'}!</h2>`:''}<button class="btn" id="re">Play again 🔄</button>`;
 $('#modal').classList.add('show');$('#re').onclick=()=>{$('#modal').classList.remove('show');newGame()};say('You found the treasure!')}
function lose(){over=true;sBad();dug[tr]={h:0};draw();$('#q').innerHTML=`<div class="big">😭⛏️</div><h2>No more shovels!</h2><p style="font-size:19px">The treasure was here 💰 — look at the map!</p><button class="btn" id="re">Try again 🔄</button>`;$('#modal').classList.add('show');$('#re').onclick=()=>{$('#modal').classList.remove('show');newGame()}}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=+b.dataset.v;newGame()});
let lastC=cols();addEventListener('resize',()=>{if(cols()!==lastC&&!Object.keys(dug).length){lastC=cols();newGame()}});
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COL=['#ffd84d','#ff8a3d','#2bb3d9','#1fb36b','#fff'];
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<50;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.9)*11,s:4+Math.random()*7,c:COL[i%5],l:70});loop()}
function rain(){for(let i=0;i<180;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,c:COL[i%5],l:240});loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.17;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});if(parts.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
newGame();
</script>
