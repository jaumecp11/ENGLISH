<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Station Escape</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#141a2e;--bg2:#1f2846;--ink:#f3f6ff;--muted:#a7b3d9;--gold:#ffc83d;--good:#2fd27a;--bad:#ff5a6a;--card:#253055;--line:#3a4775}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#141a2e}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:14px 16px 28px;background:radial-gradient(circle at 20% 0%,#2e3a6e 0,#141a2e 55%);overflow-x:hidden}
.wrap{max-width:1150px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
h1{font-size:clamp(24px,4.4vw,42px);line-height:1}
h1 span{color:var(--gold)}
h1 small{display:block;font-size:.4em;color:var(--muted);font-weight:500;margin-top:6px}
.timer{font-family:'Share Tech Mono',monospace;font-size:clamp(26px,4vw,40px);background:#0b0f1d;border:3px solid var(--line);border-radius:14px;padding:4px 16px;color:var(--gold);display:flex;align-items:center;gap:10px}
.timer.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.timer button{font:600 13px 'Fredoka';background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:4px 8px;cursor:pointer}
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:16px;align-items:start}
.scene{position:relative;border-radius:20px;overflow:hidden;border:4px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none}
.scene img{display:block;width:100%;aspect-ratio:1;pointer-events:none}
.scene.dark img{filter:brightness(.55) saturate(.8)}
.ring{position:absolute;border:4px solid var(--gold);border-radius:16px;box-shadow:0 0 0 4px rgba(0,0,0,.4),0 0 24px var(--gold);animation:pulse 1.2s infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.08)}}
.hitmark{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid;pointer-events:none;animation:hm .7s forwards}
@keyframes hm{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.found{position:absolute;border:3px solid var(--good);border-radius:12px;background:rgba(47,210,122,.18);pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px}
.locks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lock{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:.3s}
.lock .i{font-size:30px;display:block}
.lock .d{font-family:'Share Tech Mono';font-size:22px;color:var(--gold);display:block;min-height:26px}
.lock.cur{border-color:var(--gold);color:var(--ink);transform:translateY(-3px)}
.lock.done{border-color:var(--good);color:var(--good)}
.panel{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;min-height:260px}
.panel .tag{display:inline-block;background:#0b0f1d;color:var(--gold);border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px;margin-bottom:8px}
.panel h2{font-size:clamp(20px,2.8vw,27px);line-height:1.2;margin-bottom:6px}
.panel h2 .bl{display:inline-block;min-width:70px;border-bottom:3px dashed var(--muted)}
.panel p{color:var(--muted);font-size:16px}
.prog{display:flex;gap:5px;margin:10px 0}
.prog i{flex:1;height:8px;border-radius:9px;background:#0b0f1d}
.prog i.on{background:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{font:600 clamp(16px,2.2vw,20px) 'Fredoka';background:#33407a;color:var(--ink);border:0;border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 4px 0 #1b2350}
.opt:hover{background:#3d4b8f}
.opt.ok{background:var(--good);color:#06301a}
.opt.no{background:var(--bad)}
.btn{font:700 19px 'Fredoka';background:var(--gold);color:#2a1d00;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;box-shadow:0 5px 0 #b88a00;margin-top:12px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b88a00}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-width:280px}
.keypad button{font:700 24px 'Share Tech Mono';background:#0b0f1d;color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.screen{font:700 38px 'Share Tech Mono';letter-spacing:12px;background:#0b0f1d;color:var(--good);border-radius:12px;padding:6px 14px;margin-top:10px;max-width:280px;text-align:center;border:3px solid var(--line)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#0b0f1d;border:3px solid var(--gold);color:var(--ink);padding:10px 20px;border-radius:14px;font-weight:700;font-size:20px;transition:.35s;z-index:50;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.trainrun{position:absolute;bottom:8%;left:-40%;font-size:90px;animation:go 3s ease-in forwards}
@keyframes go{to{left:120%}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:820px){.game{grid-template-columns:1fr}.panel{min-height:0}.lock{font-size:11px}.lock .i{font-size:24px}}
</style>

const NAMES={bird:'the red bird',clock:'the clock',board:'the departures board',suitcase:'the purple suitcase',office:'the ticket office',dog:'the dog',waiting:'the waiting room',umbrella:'the yellow umbrella',lift:'the lift',train:'the train',tunnel:'the tunnel',platform:'the platform',ball:'the blue ball',escalator:'the escalator',stairs:'the stairs',cat:'the black cat',bench:'the bench',plant:'the plant'};

const WHERE=[['cat','The cat is ___ the bench.','below'],['bird','The bird is ___ the clock.','above'],['suitcase','The suitcase is ___ the ticket office.','in front of'],['umbrella','The umbrella is ___ the lift.','inside'],['dog','The dog is ___ the waiting room.','outside'],['train','The train is coming ___ the tunnel.','through'],['clock','The clock is ___ the bird.','below'],['board','The departures board is ___ the platform.','above']];
const PREPS=['above','below','in front of','inside','outside','through'];
const PLACES=['escalator','lift','stairs','office','board','waiting','platform','tunnel','bench'];
const RULES=[['🏃‍♂️🚫','You ___ run on the escalator.','must not',['must','need to']],['🎫','You ___ buy a ticket before you get on the train.','must',['must not','do not need to']],['🚭','You ___ smoke in the station.','must not',['must','needs to']],['🟨','You ___ stand behind the yellow line.','must',['must not','does not need to']],['🛗🔧','The lift is broken. You ___ use the lift.','must not',['must','need to']],['🤫','You ___ be quiet in the waiting room.','must',['must not','do not need to']],['⚽','You ___ play football on the platform.','must not',['must','need to']],['🧳','You ___ leave your bags alone.','must not',['must','needs to']],
['✅🎫','I have got my ticket. I ___ buy a ticket.','do not need to',['need to','does not need to']],['❌🎫','Sara has not got a ticket. She ___ buy one.','needs to',['need to','does not need to']],['⏰','We are late! We ___ run to the platform!','need to',['needs to','do not need to']],['☀️','It is sunny. You ___ take an umbrella.','do not need to',['need to','does not need to']],['☂️','Tom has got his umbrella. He ___ buy one.','does not need to',['do not need to','needs to']],['🎟️','Max wants a ticket. He ___ find the ticket office.','needs to',['need to','do not need to']]];
const LOCKS=[{n:'Find it',i:'🔍',k:'find',q:5},{n:'Where?',i:'📍',k:'where',q:5},{n:'Places',i:'🚉',k:'places',q:5},{n:'Rules',i:'⚠️',k:'rules',q:6}];
const $=s=>document.querySelector(s);const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let code,lockI,qI,qs,T=600,timerOn=true,tick,state,cur;
let ac;function tone(f,d=.12,v=.1,w=0,t='triangle'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d)}catch(e){}}
const sGood=()=>[660,990].forEach((f,i)=>tone(f,.14,.1,i*.08,'sine')),sBad=()=>tone(160,.3,.09,0,'sawtooth'),sUnlock=()=>[400,600,800,1200].forEach((f,i)=>tone(f,.12,.1,i*.07,'square')),sWin=()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.2,.1,i*.13));
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));u.lang='en-GB';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}
function fmt(s){return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function drawLocks(){$('#locks').innerHTML=LOCKS.map((L,k)=>`<div class="lock ${k<lockI?'done':k===lockI&&state==='play'?'cur':''}"><span class="i">${k<lockI?'🔓':L.i}</span>${L.n}<span class="d">${k<lockI?code[k]:'?'}</span></div>`).join('')}
function clearMarks(){document.querySelectorAll('.ring,.found,.trainrun').forEach(e=>e.remove())}
function rect(k,cls){const [x,y,w,h]=H[k];const d=document.createElement('div');d.className=cls;Object.assign(d.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});$('#scene').appendChild(d);return d}
function intro(){
 state='intro';lockI=0;code=[...Array(4)].map(()=>1+Math.random()*9|0);T=600;clearMarks();drawLocks();$('#time').textContent=fmt(T);$('#scene').classList.add('dark');
 $('#panel').innerHTML=`<span class="tag">🌙 Mission</span><h2>Oh no! You are locked in the train station at night! 🔒</h2><p>The last train leaves in <b>10 minutes</b>. Open the <b>4 locks</b> to get the secret code. Then type the code and catch the train!</p><button class="btn" id="go">Start the escape ▶</button>`;
 $('#go').onclick=()=>{state='play';$('#scene').classList.remove('dark');startLock();clearInterval(tick);tick=setInterval(()=>{if(!timerOn||state!=='play')return;T--;$('#time').textContent=fmt(Math.max(0,T));$('#timerBox').classList.toggle('low',T<=60);if(T<=0)lose()},1000)};
}
function startLock(){
 qI=0;const L=LOCKS[lockI];drawLocks();clearMarks();
 if(L.k==='find')qs=shuffle([...FIND]).slice(0,L.q);
 if(L.k==='where')qs=shuffle([...WHERE]).slice(0,L.q);
 if(L.k==='places')qs=shuffle([...PLACES]).slice(0,L.q);
 if(L.k==='rules')qs=shuffle([...RULES]).slice(0,L.q);
 showQ();
}
function prog(){const L=LOCKS[lockI];return `<div class="prog">${[...Array(L.q)].map((_,i)=>`<i class="${i<qI?'on':''}"></i>`).join('')}</div>`}
function showQ(){
 clearMarks();const L=LOCKS[lockI];const q=qs[qI];cur={};
 if(L.k==='find'){cur={type:'click',target:q[1],say:q[0],full:q[2]};$('#panel').innerHTML=`<span class="tag">${L.i} Lock ${lockI+1} · ${L.n}</span>${prog()}<h2>${q[0]}</h2><p>👆 Click on the picture. 🔊 <a href="#" id="rep" style="color:var(--gold)">Listen again</a></p>`;say(q[0])}
 if(L.k==='places'){const ph={escalator:'the escalator',lift:'the lift',stairs:'the stairs',office:'the ticket office',board:'the departures board',waiting:'the waiting room',platform:'the platform',tunnel:'the tunnel',bench:'the bench'}[q];
  cur={type:'click',target:q,say:'Click on '+ph};$('#panel').innerHTML=`<span class="tag">${L.i} Lock ${lockI+1} · ${L.n}</span>${prog()}<h2>Click on <b style="color:var(--gold)">${ph}</b>.</h2><p>👆 Find it in the station. 🔊 <a href="#" id="rep" style="color:var(--gold)">Listen again</a></p>`;say(cur.say)}
 if(L.k==='where'){const [k,s,ans]=q;rect(k,'ring');const o=shuffle([ans,...shuffle(PREPS.filter(p=>p!==ans)).slice(0,3)]);cur={type:'opt',ans,full:s.replace('___',ans)};
  $('#panel').innerHTML=`<span class="tag">${L.i} Lock ${lockI+1} · ${L.n}</span>${prog()}<h2>Look at the yellow square! ✨<br>${s.replace('___','<span class="bl"></span>')}</h2><div class="opts">${o.map(x=>`<button class="opt">${x}</button>`).join('')}</div>`}
 if(L.k==='rules'){const [e,s,ans,wr]=q;const o=shuffle([ans,...wr]);cur={type:'opt',ans,full:s.replace('___',ans)};
  $('#panel').innerHTML=`<span class="tag">${L.i} Lock ${lockI+1} · ${L.n}</span>${prog()}<div style="font-size:54px;text-align:center">${e}</div><h2>${s.replace('___','<span class="bl"></span>')}</h2><div class="opts">${o.map(x=>`<button class="opt">${x}</button>`).join('')}</div>`}
 const rep=$('#rep');if(rep)rep.onclick=e=>{e.preventDefault();say(cur.say)};
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=b.textContent===cur.ans;
  if(ok){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');right(cur.full)}else{b.classList.add('no');b.disabled=true;wrong()}});
}
function right(sentence){sGood();say(sentence);toast('✅ '+sentence);qI++;burstEl($('#panel'));setTimeout(()=>{if(qI>=LOCKS[lockI].q)unlock();else showQ()},1500)}
function wrong(){sBad();$('#panel').classList.remove('shake');void $('#panel').offsetWidth;$('#panel').classList.add('shake');if(timerOn){T=Math.max(0,T-10);toast('❌ −10 seconds!')}else toast('❌ Try again!')}
function unlock(){sUnlock();lockI++;drawLocks();clearMarks();
 if(lockI>=LOCKS.length)return keypad();
 $('#panel').innerHTML=`<span class="tag">🔓 Lock opened!</span><h2>Number <b style="color:var(--gold);font-size:1.4em">${code[lockI-1]}</b> is part of the code!</h2><p>Remember it… or look at the locks above.</p><button class="btn" id="nx">Next lock ▶</button>`;$('#nx').onclick=startLock}
function keypad(){let typed='';
 $('#panel').innerHTML=`<span class="tag">🔢 Final door</span><h2>Type the secret code to open the gate to the train!</h2><div class="screen" id="scr">____</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>`;
 document.querySelectorAll('.keypad button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;tone(500,.05,.07);
  if(k==='⌫')typed=typed.slice(0,-1);else if(k==='✔'){if(typed===code.join(''))return win();sBad();$('#scr').classList.add('shake');setTimeout(()=>$('#scr').classList.remove('shake'),400);typed=''}else if(typed.length<4)typed+=k;
  $('#scr').textContent=(typed+'____').slice(0,4)});
}
function win(){state='win';clearInterval(tick);sWin();rain();const st=T>300?'⭐⭐⭐':T>120?'⭐⭐':'⭐';
 const tr=document.createElement('div');tr.className='trainrun';tr.textContent='🚆💨';$('#scene').appendChild(tr);
 $('#panel').innerHTML=`<span class="tag">🎉 You escaped!</span><h2>You caught the last train! 🚆</h2><p style="font-size:22px">${st}<br>Time left: <b style="color:var(--gold)">${fmt(T)}</b></p><button class="btn" id="re">Play again ↻</button>`;$('#re').onclick=intro;say('Well done! You caught the last train!')}
function lose(){state='lose';clearInterval(tick);sBad();$('#scene').classList.add('dark');$('#panel').innerHTML=`<span class="tag">⏰ Time is up!</span><h2>Oh no! The last train has left… 😢</h2><p>Try again — you can turn the timer off at the top.</p><button class="btn" id="re">Try again ↻</button>`;$('#re').onclick=intro}
$('#scene').addEventListener('pointerdown',e=>{
 const r=$('#scene').getBoundingClientRect(),px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100;
 if(state!=='play'||!cur||cur.type!=='click'||cur.lock)return;
 const hit=ORDER.find(k=>{const [x,y,w,h]=H[k];return px>=x&&px<=x+w&&py>=y&&py<=y+h});
 const m=document.createElement('div');m.className='hitmark';m.style.left=px+'%';m.style.top=py+'%';
 const [tx,ty,tw,th]=H[cur.target];const ok=px>=tx-1&&px<=tx+tw+1&&py>=ty-1&&py<=ty+th+1;m.style.borderColor=ok?'var(--good)':'var(--bad)';$('#scene').appendChild(m);setTimeout(()=>m.remove(),800);
 if(ok){cur.lock=1;rect(cur.target,'found');right(cur.full||(NAMES[cur.target][0].toUpperCase()+NAMES[cur.target].slice(1)+'!'))}
 else wrong();
});
$('#tgl').onclick=()=>{timerOn=!timerOn;$('#tgl').textContent='Timer: '+(timerOn?'ON':'OFF');$('#timerBox').classList.remove('low')};
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COL=['#ffc83d','#2fd27a','#5ab8ff','#ff6fb1','#fff'];
function burstEl(el){const r=el.getBoundingClientRect();for(let i=0;i<24;i++)parts.push({x:r.left+r.width/2,y:r.top+40,vx:(Math.random()-.5)*10,vy:(Math.random()-.9)*8,s:4+Math.random()*5,c:COL[i%5],l:50});loop()}
function rain(){for(let i=0;i<180;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,c:COL[i%5],l:240});loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.17;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});if(parts.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
intro();
</script>
