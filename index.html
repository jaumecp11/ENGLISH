<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:linear-gradient(135deg,#5b3fd9,#c2255c);--acc:#5b3fd9;--ink:#26214a;--mut:#5c5780}
html{background:#5b3fd9}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:20px 16px 70px;background:var(--bg) fixed;position:relative;overflow-x:hidden;transition:background .3s}
body:before,body:after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;z-index:0}
body:before{width:460px;height:460px;top:-160px;right:-140px}
body:after{width:300px;height:300px;bottom:-90px;left:-90px}
.wrap{max-width:1120px;margin:0 auto;position:relative;z-index:1}
button{font-family:inherit}
a{color:inherit}
/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.logo{background:none;border:0;padding:0;cursor:pointer;color:#fff;font:700 32px Fredoka,sans-serif;display:flex;align-items:center;gap:10px;text-shadow:0 3px 0 rgba(0,0,0,.15);min-height:44px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rank{display:inline-flex;align-items:center;gap:8px;background:#ffcf3f;color:#3a2a00;font-weight:700;font-size:19px;padding:10px 20px;border-radius:999px;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .12s}
.rank:hover{transform:translateY(-2px)}
.hr .efchip{position:static!important;box-shadow:0 5px 0 rgba(0,0,0,.18)!important;font-size:16px!important;padding:6px 16px 6px 8px!important;min-height:46px}
.hr .efchip .av{font-size:24px!important}
.hr .efchip:empty{display:none!important}
.stp{display:none;align-items:center;gap:6px;background:#fff;color:var(--ink);font-weight:700;font-size:16px;padding:10px 16px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.stp.on{display:inline-flex}
/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:28px}
.hi{color:#fff;font-size:19px;font-weight:600;opacity:.95}
.hero h1{color:#fff;font-size:clamp(30px,5vw,44px);line-height:1.1;margin-top:4px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.cpick{width:100%}
.cbadge{display:inline-block;vertical-align:middle;background:#fff;border-radius:14px;padding:2px 14px;font-size:.6em;box-shadow:0 4px 0 rgba(0,0,0,.18);text-shadow:none;margin-left:6px}
.clab{color:#fff;font-size:18px;font-weight:700;margin-bottom:10px;opacity:.95}
.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.courses button{position:relative;border:4px solid transparent;cursor:pointer;background:#fff;color:var(--c);border-radius:24px;padding:12px 8px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.courses button b{font-size:40px;line-height:1;font-weight:700}
.courses button small{font-size:15px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.courses button:hover{transform:translateY(-4px);box-shadow:0 11px 0 rgba(0,0,0,.2)}
.courses button.on{background:var(--g);color:#fff;border-color:#fff;transform:translateY(-4px);box-shadow:0 11px 0 rgba(0,0,0,.25)}
.courses button.on small{color:rgba(255,255,255,.9)}
.courses button.on::after{content:'✓';position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;background:#ffcf3f;color:#3a2a00;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:30px}
.tile{text-align:left;border:0;cursor:pointer;background:#fff;border-radius:32px;padding:28px;box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:14px;color:var(--ink);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-6px);box-shadow:0 16px 0 rgba(0,0,0,.18)}
.tile .tt{display:flex;justify-content:space-between;align-items:center}
.tile .ti{width:88px;height:88px;border-radius:28px;font-size:48px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.tile:hover .ti{transform:rotate(-8deg) scale(1.06)}
.tile .ar{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.tile h2{font-size:38px;line-height:1}
.tile p{font-size:17px;color:var(--mut);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:#f1effa;padding:6px 12px;border-radius:999px;font-size:15px;font-weight:600}
.chips span.y{background:#fff9db}
.bar{height:12px;border-radius:999px;background:#eceaf6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;width:0;transition:width .5s}
.pl{font-size:15px;color:var(--mut);font-weight:600}
.allbtn{display:flex;justify-content:center;margin-top:30px}
.ghost{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:700;font-size:19px;padding:12px 26px;border-radius:999px;cursor:pointer;min-height:48px;transition:background .15s}
.ghost:hover{background:rgba(255,255,255,.26)}
/* sub views */
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.back{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:700;font-size:17px;padding:8px 18px;border-radius:999px;cursor:pointer;min-height:44px}
.modes{display:flex;gap:4px;background:rgba(0,0,0,.16);padding:5px;border-radius:999px;flex-wrap:wrap}
.modes button{border:0;cursor:pointer;font-weight:700;font-size:17px;padding:8px 18px;min-height:44px;border-radius:999px;background:transparent;color:#fff}
.modes button.on{background:#fff;color:var(--acc)}
.unav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.unav a{background:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.units{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.unit{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:20px;scroll-margin-top:12px}
.uh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ub{width:54px;height:54px;border-radius:17px;background:#fff;color:var(--acc);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15);flex-shrink:0}
.ut{display:flex;flex-direction:column;flex:1;min-width:160px}
.ut h2{color:#fff;font-size:26px;line-height:1.1}
.ut span{color:#fff;opacity:.92;font-weight:600;font-size:16px}
.up{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px}
.up b{display:block;width:80px;height:8px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.up b i{display:block;height:100%;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:22px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.16);min-height:196px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;transition:transform .2s;flex-shrink:0}
.ic.g{font-size:21px}.ic.g.l{font-size:16px}
.card:hover .ic,.row:hover .ic{transform:scale(1.12) rotate(-6deg)}
.card b{font-size:19px;line-height:1.15;margin-top:6px}
.card small{font-size:14px;color:var(--mut)}
.tag{align-self:flex-start;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.card .tag{margin-top:auto}
.st{color:#e8a100;font-size:19px;letter-spacing:1px;white-space:nowrap}
.new{background:var(--acc);color:#fff;font-size:12px;font-weight:700;letter-spacing:.5px;padding:4px 9px;border-radius:999px;white-space:nowrap}
/* all view */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.col{background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 7px 0 rgba(0,0,0,.14)}
.ch{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:19px;padding:0 4px 4px}
.ch span:last-child{font-size:14px;padding:3px 10px;border-radius:999px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;text-decoration:none;color:var(--ink);background:#f8f7fc;transition:background .15s}
.row:hover{background:#efedf9}
.row .ic{width:46px;height:46px;border-radius:14px;font-size:25px}
.row .ic.g{font-size:17px}.row .ic.g.l{font-size:13px}
.row .rt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.row b{font-size:17px;line-height:1.15}
.row .tag{font-size:12px;padding:2px 8px}
.row .st{font-size:16px}
.empty{color:#6b6790;font-size:15px;padding:10px 4px}
.hide{display:none!important}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}

.ico{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;vertical-align:middle}
.ico img{width:100%;height:100%;object-fit:contain}
.rank .ico{width:30px;height:30px}.stp .ico{width:24px;height:24px}.ghost .ico,.thb .ico{width:30px;height:30px}.modes .ico{width:26px;height:26px}
.ti img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.ic.im{background:none!important;width:66px;height:66px}
.ic.im img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.row .ic.im{width:50px;height:50px}
/* theory */
.thb{background:#fff;color:var(--acc);border:0;font-weight:700;font-size:17px;padding:9px 18px;border-radius:999px;cursor:pointer;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tov{position:fixed;inset:0;z-index:60;display:none;overflow:auto;padding:20px 16px 40px;background:var(--bg)}
.tov.on{display:block}
.tin{max-width:1080px;margin:0 auto}
.thd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#fff;margin-bottom:16px}
.thd h2{font-size:clamp(26px,4.5vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.15)}
.thd h2 small{display:block;font-size:.45em;opacity:.95}
.tgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));grid-auto-flow:row dense;gap:16px}
.tc{background:#fff;border-radius:24px;padding:18px;box-shadow:0 7px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;gap:10px}
.tc.w{grid-column:1/-1}
.tc h3{font-size:clamp(20px,2.6vw,24px)}
.tca{background:#fff7d6;border-left:5px solid #ffcf3f;border-radius:12px;padding:8px 12px;font-size:16px}
.tc table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px}
.tc th{text-align:left;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:2px 8px}
.tc td{background:#f6f4fd;padding:8px 10px;font-weight:600}
.tc td:first-child{border-radius:10px 0 0 10px}.tc td:last-child{border-radius:0 10px 10px 0}
.hl{background:#ffd43b;border-radius:6px;padding:0 4px}
.tex{display:flex;flex-direction:column;gap:6px}
.tex button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:#f6f4fd;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:17px;font-weight:600;color:var(--ink)}
.tex button:hover{background:#ece8fb}
.tex small{display:block;font-size:13px;color:var(--mut);font-weight:500}
@media (max-width:600px){.tc table{font-size:14px}.tc td{padding:6px}}
@media (max-width:600px){.logo{font-size:26px}.tile{padding:22px}.tile h2{font-size:32px}.courses{gap:10px}.courses button{min-height:76px;border-radius:20px}.courses button b{font-size:32px}.courses button small{font-size:12px}}
</style></head><body>
<div class="wrap">
 <header class="hdr">
  <button class="logo" id="logo"><span>🎮</span><span>English Games</span></button>
  <div class="hr" id="hr"><a class="rank" href="leaderboard.html"><i class="ico" data-ico="rank">🏆</i> Rànquing</a><span class="stp" id="stp"><i class="ico" data-ico="star">⭐</i> <b id="stN">0</b></span><button class="efchip" id="efchip"></button></div>
 </header>
 <div class="hero">
  <div><p class="hi" id="hi">Hola! 👋</p><h1 id="ttl">Què vols practicar avui?</h1></div>
  <div class="cpick"><p class="clab">👇 Tria el teu curs</p><nav class="courses" id="tabs" aria-label="Curs"></nav></div>
 </div>
 <section id="vHome">
  <div class="tiles">
   <button class="tile" data-go="vocab"><span class="tt"><span class="ti" style="background:#e7f5ff" data-ico="vocab">📖</span><span class="ar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span>
    <h2>Vocabulary</h2><p>Les paraules de cada unitat: sopes de lletres, memory, endevinalles…</p>
    <span class="chips"><span>🎮 <b data-k="v.count"></b> jocs</span><span>📚 <b data-k="v.units"></b> unitats</span><span class="y lg">⭐ <b data-k="v.stars"></b></span></span>
    <span class="bar lg"><i data-w="v.pct"></i></span><span class="pl lg"><b data-k="v.played"></b> de <b data-k="v.count"></b> jocs jugats</span></button>
   <button class="tile" data-go="grammar"><span class="tt"><span class="ti" style="background:#f8f0fc" data-ico="grammar">✏️</span><span class="ar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span>
    <h2>Grammar</h2><p id="gDesc">Estructures i verbs de cada unitat</p>
    <span class="chips"><span>🎮 <b data-k="g.count"></b> jocs</span><span>📚 <b data-k="g.units"></b> unitats</span><span class="y lg">⭐ <b data-k="g.stars"></b></span></span>
    <span class="bar lg"><i data-w="g.pct"></i></span><span class="pl lg"><b data-k="g.played"></b> de <b data-k="g.count"></b> jocs jugats</span></button>
  </div>
  <div class="allbtn"><button class="ghost" data-go="all"><i class="ico" data-ico="all">🧩</i> Veure-ho tot junt</button></div>
 </section>
 <section id="vSub" class="hide">
  <div class="bar2"><button class="back" data-go="home">← Inici</button><div class="modes" id="modes"><button data-go="vocab"><i class="ico" data-ico="vocab">📖</i> Vocabulary</button><button data-go="grammar"><i class="ico" data-ico="grammar">✏️</i> Grammar</button><button data-go="all"><i class="ico" data-ico="all">🧩</i> Tot junt</button></div><button class="thb" id="thBtn"><i class="ico" data-ico="learn">📖</i> Teoria de grammar</button></div>
  <nav class="unav" id="unav" aria-label="Unitats"></nav>
  <div class="units" id="units"></div>
 </section>
</div>
<div class="tov" id="tov"><div class="tin"><div class="thd"><h2 id="thT"></h2><button class="ghost" id="thX">✕ Tanca</button></div><div class="tgr" id="tgr"></div></div></div>
<script src="icons.js"></script>
<script>
const TH_H=['Who? · Qui?','✅ Affirmative','❌ Negative','❓ Question'];
const TB={
 be:(ex)=>({ic:'🟦',t:'Verb to be: am · is · are',ca:'Per dir com és, com està o on és algú.',table:[TH_H,['I','I {am}','I {am not}','{Am} I…?'],['He / She / It','He {is}','He {is not}','{Is} he…?'],['You / We / They','You {are}','You {are not}','{Are} you…?']],ex}),
 have:(ex)=>({ic:'🎒',t:'Have got · has got',ca:'Per dir què <b>té</b> algú. He / She / It → <b>has got</b>.',table:[TH_H,['I / You / We / They','I {have got}','I {have not got}','{Have} you {got}…?'],['He / She / It','She {has got}','She {has not got}','{Has} she {got}…?']],ex}),
 ps:(ex,they)=>({ic:'🔁',t:'Present simple',ca:'El que fem <b>sempre</b> o <b>cada dia</b>.'+(they?'':' He / She / It → verb + <b>s</b>.'),table:they?[TH_H,['I / You / We / They','They {swim}','They {do not fly}','{Do} they {swim}?']]:[TH_H,['I / You / We / They','I {play}','I {do not play}','{Do} you {play}?'],['He / She / It','He {plays}','He {does not play}','{Does} he {play}?']],ex}),
 pc:(ex)=>({ic:'📸',t:'Present continuous',ca:'El que passa <b>ara mateix</b>: am / is / are + verb<b>-ing</b>.',table:[TH_H,['I','I {am playing}','I {am not playing}','{Am} I {playing}?'],['He / She / It','She {is playing}','She {is not playing}','{Is} she {playing}?'],['You / We / They','They {are playing}','They {are not playing}','{Are} they {playing}?']],ex}),
 sc:{ic:'⚖️',t:'Simple or continuous?',ca:'<b>Every day, always, on Mondays</b> → present simple. <b>Now, at the moment</b> → present continuous.',table:[['🔁 Every day','📸 Now'],['I {play} tennis on Mondays.','I {am playing} tennis now.'],['She {walks} to school.','She {is walking} to school now.']]},
 cmp:{ic:'⚖️',t:'Comparatives: -er than · more … than',ca:'Per comparar <b>dues</b> coses.',table:[['Adjective','Comparative','Rule'],['fast · old · tall','{faster} · {older} · {taller}','+ er'],['big · hot','{bigger} · {hotter}','double the letter'],['noisy · heavy','{noisier} · {heavier}','y → ier'],['expensive · dangerous','{more expensive} · {more dangerous}','more + adjective'],['good · bad','{better} · {worse}','irregular!']],ex:[['The cheetah is {faster than} the horse.','El guepard és més ràpid que el cavall.'],['The city is {more crowded than} the village.','La ciutat és més plena de gent que el poble.']]},
 sup:{ic:'🏆',t:'Superlatives: the -est · the most …',ca:'Per dir quin és el <b>més</b> de tres o més.',table:[['Adjective','Superlative'],['fast · tall','{the fastest} · {the tallest}'],['big','{the biggest}'],['heavy','{the heaviest}'],['expensive','{the most expensive}'],['good · bad','{the best} · {the worst}']],ex:[['The elephant is {the biggest} animal.','L’elefant és l’animal més gran.'],['Granny Rose is {the oldest} in the family.','La Granny Rose és la més gran de la família.']]},
};
const THEORY={
'3r':[TB.be([['The panda {is} black and white.','El panda és blanc i negre.'],['Pandas {are} big.','Els pandes són grans.'],['The tortoise {is not} fast.','La tortuga no és ràpida.']]),
 TB.have([['The tiger {has got} stripes.','El tigre té ratlles.'],['Parrots {have got} colourful feathers.','Els lloros tenen plomes de colors.']]),
 TB.ps([['Seals {swim} in the sea.','Les foques neden al mar.'],['Tortoises {do not run}.','Les tortugues no corren.']],true),
 {ic:'❤️',t:'I like … best',ca:'Per dir què t’agrada <b>més</b> de tot.',ex:[['Which animals do you like {best}?','Quins animals t’agraden més?'],['I like {dolphins} best.','M’agraden més els dofins.']]}],
'4t':[TB.be([['I {am} tired.','Estic cansat.'],['{Are} you OK? — Yes, I am.','Estàs bé? — Sí.']]),
 TB.have([['I {have got} a cold.','Estic refredat.'],['She {has got} a headache.','Té mal de cap.']]),
 {ic:'🤒',t:'What is the matter?',ca:'Per preguntar què li passa a algú.',table:[['Question','Answer'],['What is the matter {with you}?','I {have got} a cold.'],['What is the matter {with him}?','He {has got} a sore throat.'],['What is the matter {with her}?','She {has got} a stomach ache.']]},
 {ic:'👀',t:'Is or has got?',ca:'<b>is</b> → com és. <b>has got</b> → què té.',table:[['is','has got'],['He {is} tall.','He {has got} short hair.'],['She {is} thin.','She {has got} blue eyes.']]},
 {ic:'⏰',t:'What time is it?',ca:'Per dir l’hora.',ex:[['It is {eight o’clock}.','Són les vuit.'],['It is {quarter past} eight.','Són les vuit i quart.'],['It is {half past} eight.','Són les vuit i mitja.'],['It is {quarter to} nine.','Són tres quarts de nou.']]},
 TB.ps([['I {get up} at seven o’clock.','Em llevo a les set.'],['She {has} breakfast at eight.','Esmorza a les vuit.']])],

function badge(g){if(g.bs!=null)return `<span class="st" aria-label="${g.bs} de 3 estrelles">${'★'.repeat(g.bs)}${'☆'.repeat(3-g.bs)}</span>`;return logged()?'<span class="new">NOU</span>':''}

function tag(g){const t=TYPES[g.ty];return `<span class="tag" style="background:${t[1]};color:${t[2]}">${t[0]}</span>`}
