<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Family Top Trumps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1650;--gold:#f5b81b;--gold2:#ffd965;--purple:#6b2fd6;--purple2:#9b6bff;--felt:#1f6b4f;--felt2:#145039;--panel:#fff;--good:#1fbf6a;--bad:#ef4444;--radius:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:radial-gradient(ellipse at center,#2a8a65 0%,var(--felt) 45%,var(--felt2) 100%) fixed #1f6b4f;min-height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:16px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px)}
.wrap{max-width:1080px;margin:0 auto;position:relative}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{color:#fff;font-size:clamp(28px,5vw,46px);line-height:1;text-shadow:0 4px 0 var(--purple),0 8px 20px rgba(0,0,0,.35)}
h1 span{color:var(--gold2)}
h1 small{display:block;font-size:.38em;color:#d9ffe9;text-shadow:none;font-weight:600;margin-top:4px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
.seg button{font-family:inherit;border:0;background:transparent;color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--ink)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.pl{background:rgba(255,255,255,.95);border-radius:16px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:.3s}
.pl.turn{outline:4px solid var(--gold);transform:translateY(-2px)}
.pl .n{font-size:16px}.pl .c{display:flex;gap:12px}
.pot{color:#fff;font-weight:800;text-align:center;font-size:15px;min-width:70px}
.pot b{display:block;font-size:24px;color:var(--gold2)}
.table{display:grid;grid-template-columns:1fr minmax(200px,280px) 1fr;gap:16px;align-items:start}
.slot{display:flex;justify-content:center;perspective:1400px}
.card{width:100%;max-width:330px;aspect-ratio:5/7.6;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.card.hidden{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35)}
.bk{transform:rotateY(180deg);background:#5a22b8 center/cover;border:8px solid var(--gold)}
.fr{background:linear-gradient(180deg,var(--gold2),var(--gold));padding:8px;display:flex;flex-direction:column}
.pic{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/0.82;background:#fff center 25%/cover;border:3px solid #fff}
.nm{position:absolute;left:8px;bottom:8px;background:var(--purple);color:#fff;font-weight:800;padding:2px 12px;border-radius:999px;font-size:clamp(15px,2vw,20px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.likes{font-size:clamp(12px,1.5vw,15px);font-weight:700;margin:5px 4px 3px;color:#5b3a00}
.stats{display:flex;flex-direction:column;gap:5px;flex:1}
.st{font-family:inherit;display:flex;align-items:center;justify-content:space-between;background:#fff;border:0;border-radius:11px;padding:4px 10px;font-size:clamp(14px,1.8vw,18px);font-weight:700;color:var(--ink);cursor:default;flex:1;transition:.15s;text-align:left}
.st .v{font-weight:800;color:var(--purple)}
.st .v small{font-size:.7em;color:#777;margin-left:2px}
.card.choose .st{cursor:pointer;box-shadow:0 3px 0 #d39b00}
.card.choose .st:hover{transform:translateX(4px) scale(1.02);background:#f1e9ff}
.st.sel{background:var(--purple)!important;color:#fff}.st.sel .v,.st.sel .v small{color:#fff}
.st.win{background:var(--good)!important;color:#fff}.st.win .v,.st.win .v small{color:#fff}
.st.lose{background:#ffd5d5!important;color:var(--ink)}.st.lose .v{color:#b42318!important}
.who{text-align:center;color:#fff;font-weight:800;margin-bottom:6px;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.mid{background:rgba(255,255,255,.96);border-radius:var(--radius);padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.25);text-align:center;margin-top:30px}
.mid h3{font-size:20px;line-height:1.2;margin-bottom:8px}
.mid p{font-size:16px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt,.btn{font-family:inherit;border:0;border-radius:14px;padding:9px 12px;font-size:17px;font-weight:700;cursor:pointer;background:#efe7ff;color:var(--ink);box-shadow:0 4px 0 #c6b2f5;transition:.12s}
.opt:hover{transform:translateY(-2px)}
.opt.ok{background:var(--good);color:#fff;box-shadow:0 4px 0 #128a4a}
.opt.no{background:var(--bad);color:#fff;box-shadow:0 4px 0 #a32020}
.btn{background:var(--gold);box-shadow:0 5px 0 #c58d00;font-size:19px;margin-top:10px;padding:10px 22px}
.btn:active,.opt:active{transform:translateY(3px);box-shadow:none}
.vs{font-size:44px;font-weight:800;color:var(--gold2);text-shadow:0 4px 0 var(--purple);text-align:center;line-height:1}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mini button{border:3px solid #fff;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:#fff center/cover;box-shadow:0 4px 0 rgba(0,0,0,.2);position:relative}
.mini button span{position:absolute;left:0;right:0;bottom:0;background:rgba(42,22,80,.8);color:#fff;font:700 11px 'Baloo 2';padding:1px}
.mini button.ok{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.mini button.no{border-color:var(--bad);opacity:.6}
.toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-10px) scale(.85);opacity:0;background:#fff;padding:12px 24px;border-radius:18px;font-weight:800;font-size:clamp(20px,3.5vw,30px);box-shadow:0 8px 0 rgba(0,0,0,.25);transition:.3s;z-index:50;pointer-events:none;text-align:center;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.tip{color:#d9ffe9;text-align:center;margin-top:14px;font-size:15px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes bump{50%{transform:scale(1.06)}}
.bump{animation:bump .4s}
.table.ending{grid-template-columns:1fr}.table.ending>div:not(.mid){display:none}.table.ending .mid{max-width:620px;width:100%;margin:10px auto 0;padding:22px}.table.ending .mid h3{font-size:26px}.table.ending .mid p{font-size:19px}.table.ending .mini button span{font-size:14px}
@media (max-width:760px){
 .table{grid-template-columns:1fr 1fr;gap:10px}
 .mid{grid-column:1/-1;grid-row:2;margin-top:0}
 .st{padding:2px 7px}.likes{margin:3px 2px}
 .pl{font-size:16px;padding:6px 10px}.pl .n{font-size:13px}
}
</style>
<canvas id="fx"></canvas>
<div class="wrap">
 <header>
  <h1>Family <span>Top Trumps</span><small>Comparatives · Superlatives · likes + -ing</small></h1>
  <div class="seg" id="mode"><button data-v="cpu" class="on">🤖 vs Computer</button><button data-v="team">👥 Team vs Team</button></div>
 </header>
 <div class="score">
  <div class="pl" id="p0"><span class="n" id="n0">🧒 You</span><span class="c"><span>🃏 <b id="c0">4</b></span><span>⭐ <b id="s0">0</b></span></span></div>
  <div class="pot">POT<b id="pot">0</b></div>
  <div class="pl" id="p1"><span class="n" id="n1">🤖 Computer</span><span class="c"><span>🃏 <b id="c1">4</b></span><span>⭐ <b id="s1">0</b></span></span></div>
 </div>
 <div class="table">
  <div><div class="who" id="w0"></div><div class="slot" id="slot0"></div></div>
  <div class="mid" id="mid"></div>
  <div><div class="who" id="w1"></div><div class="slot" id="slot1"></div></div>
 </div>
 <p class="tip">Choose a stat → the higher number wins (except ⏳ Age: you choose!) → pick the correct sentence to keep the cards.</p>
</div>

 return `<div class="face fr"><div class="pic" style="background-image:url(${IMG[i]})"><span class="nm">${f.full}</span></div>
 <div class="likes">❤️ ${f.p==='He'?'He':'She'} likes <b>${f.likes}</b></div>
 <div class="stats">${Object.keys(STATS).map(k=>`<button class="st" data-k="${k}"><span>${STATS[k].ic} ${STATS[k].l}</span><span class="v">${f[k]}<small>${STATS[k].u}</small></span></button>`).join('')}</div></div>
 <div class="face bk" style="background-image:url(${IMG[8]})"></div>`}

function newGame(){
 $('.table').classList.remove('ending');const d=shuffle([0,1,2,3,4,5,6,7]);hands=[d.slice(0,4),d.slice(4)];pot=[];stars=[0,0];chooser=0;round=0;busy=false;
 const n=names();$('#n0').textContent=n[0];$('#n1').textContent=n[1];next();
}
function upd(){$('#c0').textContent=hands[0].length;$('#c1').textContent=hands[1].length;$('#s0').textContent=stars[0];$('#s1').textContent=stars[1];$('#pot').textContent=pot.length;
 $('#p0').classList.toggle('turn',chooser===0);$('#p1').classList.toggle('turn',chooser===1)}
function deal(p,hidden){const s=$('#slot'+p);s.innerHTML=`<div class="card ${hidden?'hidden':''}" id="card${p}">${cardHTML(hands[p][0])}</div>`}

function next(){
 upd();busy=false;
 if(!hands[0].length||!hands[1].length||round>=12)return endGame();
 round++;const n=names();
 deal(0,chooser!==0);deal(1,chooser!==1);
 $('#w0').textContent=chooser===0?'👉 '+n[0]+' choose!':n[0];
 $('#w1').textContent=chooser===1?'👉 '+n[1]+(mode==='cpu'?' is choosing…':' choose!'):n[1];
 if(mode==='cpu'&&chooser===1){
  $('#mid').innerHTML=`<div class="vs">VS</div><h3>Round ${round}</h3><p>🤖 The computer is choosing a stat…</p>`;
  setTimeout(cpuChoose,1300);
 }else{
  $('#mid').innerHTML=`<div class="vs">VS</div><h3>Round ${round}</h3><p>${n[chooser]}: tap a stat on your card. Will you beat the other card?</p>`;
  const c=$('#card'+chooser);c.classList.add('choose');
  c.querySelectorAll('.st').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;if(b.dataset.k==='age')askAge(b.dataset.k);else play(b.dataset.k)});
 }
}
function cpuChoose(){
 const me=FAM[hands[1][0]];let best='height',sc=-1;
 const rank=k=>FAM.filter(f=>f[k]<me[k]).length;
 Object.keys(STATS).forEach(k=>{let r=rank(k);if(k==='age'){r=Math.max(r,7-r)}if(r>sc){sc=r;best=k}});
 if(best==='age')ageHigh=rank('age')>=3.5;
 play(best);
}
function askAge(k){
 $('#mid').innerHTML=`<h3>⏳ Age</h3><p>Do you want to be the <b>older</b> one or the <b>younger</b> one?</p><div class="opts"><button class="opt" id="ah">👵 Older wins</button><button class="opt" id="al">👶 Younger wins</button></div>`;
 $('#ah').onclick=()=>{ageHigh=true;play(k)};$('#al').onclick=()=>{ageHigh=false;play(k)};
}
function play(k){
 sFlip();
 [0,1].forEach(p=>{const c=$('#card'+p);c.classList.remove('hidden','choose');c.querySelector(`.st[data-k="${k}"]`).classList.add('sel')});
 const a=FAM[hands[0][0]],b=FAM[hands[1][0]];
 let w=(a[k]>b[k])?0:1;if(k==='age'&&!ageHigh)w=1-w;
 const winner=w,loser=1-w;
 setTimeout(()=>{
  $('#card'+winner).querySelector('.st.sel').classList.add('win');$('#card'+loser).querySelector('.st.sel').classList.add('lose');
  $('#card'+winner).classList.add('bump');
  quiz(k,winner);
 },700);
}
function quiz(k,winner){
 const S=STATS[k],W=FAM[hands[winner][0]],L=FAM[hands[1-winner][0]];
 // who is bigger in this stat
 const big=W[k]>L[k]?W:L,small=big===W?L:W;
 const fromBig=Math.random()<.5,X=fromBig?big:small,Y=fromBig?small:big,adj=fromBig?S.hi:S.lo,wrongAdj=fromBig?S.lo:S.hi,base=BASE[adj];
 const correct=`${X.n} is ${adj} than ${Y.n}.`;
 const pool=shuffle([`${X.n} is more ${base} than ${Y.n}.`,`${X.n} is ${adj} that ${Y.n}.`,`${X.n} is the ${base}est than ${Y.n}.`,`${X.n} is ${wrongAdj} than ${Y.n}.`,`${X.n} ${adj} than ${Y.n}.`]);
 const opts=shuffle([correct,pool[0],pool[1]]);
 const answerer=(mode==='cpu')?0:winner, n=names();
 $('#mid').innerHTML=`<h3>${W.n} wins! 🏆</h3><p><b>${n[answerer]}</b>: choose the correct sentence to ${answerer===winner?'keep the cards':'earn a ⭐'}.</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(b.disabled)return;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  const ok=b.textContent===correct;
  if(ok){b.classList.add('ok');sGood();stars[answerer]++;say(correct);burst(b)}
  else{b.classList.add('no');sBad();[...document.querySelectorAll('.opt')].find(x=>x.textContent===correct).classList.add('ok');say(correct)}
  const claim=ok||answerer!==winner;
  const cards=[hands[0].shift(),hands[1].shift()];
  let msg;
  if(claim){hands[winner].push(...cards,...pot);msg=`${n[winner]} ${mode==='cpu'&&winner===0?'win':'wins'} ${cards.length+pot.length} cards!`;pot=[];chooser=winner}
  else{pot.push(...cards);msg=`❌ Oops! The cards go to the POT.`;chooser=1-chooser}
  toast(ok?'✅ '+correct:msg,1800);upd();
  const nb=document.createElement('button');nb.className='btn';nb.textContent='Next round ➜';nb.onclick=next;$('#mid').appendChild(nb);
  const tip=document.createElement('p');tip.style.marginTop='8px';tip.innerHTML=`<small>${claim?msg:''} 💡 <b>${X.n}</b> is <b>${adj}</b> than <b>${Y.n}</b>: ${X[k]} vs ${Y[k]} ${S.u}.</small>`;$('#mid').appendChild(tip);
 });
}
// superlative bonus round
const SUPQ=()=>shuffle(Object.keys(STATS).flatMap(k=>[[k,0],[k,1]])).slice(0,4);
function endGame(){
 upd();const n=names();
 const res=hands[0].length===hands[1].length?"It's a draw!":(hands[0].length>hands[1].length?n[0]:n[1])+(mode==='cpu'&&hands[0].length>hands[1].length?' win the cards!':' wins the cards!');
 $('.table').classList.add('ending');$('#w0').textContent='';$('#w1').textContent='';
 const qs=SUPQ();let qi=0,turn=0;
 function ask(){
  if(qi>=qs.length)return finale(res);
  const [k,lo]=qs[qi],S=STATS[k],word=S.sup[lo];
  const ans=FAM.reduce((a,f,i)=>(lo?f[k]<FAM[a][k]:f[k]>FAM[a][k])?i:a,0);
  const who=mode==='cpu'?0:turn;
  $('#mid').innerHTML=`<h3>⭐ Superlative bonus ${qi+1}/${qs.length}</h3><p>${mode==='team'?'<b>'+n[who]+'</b>: ':''}Who is <b>the ${word}</b> in the family?</p><div class="mini">${FAM.map((f,i)=>`<button data-i="${i}" style="background-image:url(${IMG[i]})"><span>${f.n}</span></button>`).join('')}</div>`;
  say('Who is the '+word+'?');
  document.querySelectorAll('.mini button').forEach(b=>b.onclick=()=>{
   if(b.disabled)return;document.querySelectorAll('.mini button').forEach(x=>x.disabled=true);
   const i=+b.dataset.i,s=`${FAM[ans].n} is the ${word}.`;
   if(i===ans){b.classList.add('ok');sGood();stars[who]+=2;burst(b);toast('✅ '+s)}else{b.classList.add('no');sBad();document.querySelector(`.mini button[data-i="${ans}"]`).classList.add('ok');toast('💡 '+s)}
   say(s);upd();qi++;turn=1-turn;setTimeout(ask,2200);
  });
 }
 $('#mid').innerHTML=`<h3>🏁 ${res}</h3><p>Now the <b>SUPERLATIVE BONUS</b>! Each correct answer = ⭐⭐</p><button class="btn" id="go">Start ➜</button>`;
 $('#go').onclick=ask;
}
function finale(res){
 const n=names(),t0=hands[0].length+stars[0],t1=hands[1].length+stars[1];
 const champ=t0===t1?'🤝 Draw!':(t0>t1?n[0]:n[1])+' 🏆';
 $('#mid').innerHTML=`<h3>Final score</h3><p>${n[0]}: 🃏${hands[0].length} + ⭐${stars[0]} = <b>${t0}</b><br>${n[1]}: 🃏${hands[1].length} + ⭐${stars[1]} = <b>${t1}</b></p><h3 style="margin-top:10px;font-size:26px">${champ}</h3><button class="btn" id="again">Play again 🔄</button>`;
 $('#again').onclick=newGame;sWin();rain();
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;newGame()});
// fx
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COL=['#f5b81b','#9b6bff','#1fbf6a','#ff6b9d','#fff'];
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<30;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.9)*9,s:4+Math.random()*6,c:COL[i%5],l:60});loop()}
function rain(){for(let i=0;i<180;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,c:COL[i%5],l:240});loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.17;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});if(parts.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
newGame();
</script>
