<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panell del mestre · English FEDAC</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Fredoka,system-ui,sans-serif;color:#26214a;min-height:100vh;padding:16px 16px 90px;background:#f3f1fb}
.wrap{max-width:1300px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(28px,4vw,42px)}
.back{color:#fff;text-decoration:none;font-weight:700;background:#6c4cf5;padding:10px 18px;border-radius:999px;font-size:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.seg button{font:700 17px Fredoka,sans-serif;border:0;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;color:#26214a}
.seg button.on{background:#6c4cf5;color:#fff}
.btn{font:700 17px Fredoka,sans-serif;border:0;border-radius:14px;padding:10px 18px;background:#ffcf3f;color:#3a2a00;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.08);font-size:30px;font-weight:700}
.card small{display:block;font-size:15px;color:#8a86a8;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:17px}
th{text-align:left;font-size:14px;color:#8a86a8;text-transform:uppercase;padding:6px 10px;cursor:pointer;white-space:nowrap}
td{background:#fff;padding:10px;font-weight:600}
tr td:first-child{border-radius:12px 0 0 12px}tr td:last-child{border-radius:0 12px 12px 0}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f6f4ff}
.st{color:#b7791f;white-space:nowrap}
.muted{color:#8a86a8;font-size:14px}
.msg{background:#fff;border-radius:24px;padding:30px;text-align:center;font-size:20px}
.det{background:#fff;border-radius:20px;padding:18px;margin:10px 0 20px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.det h3{font-size:24px;margin-bottom:8px}
h2{font-size:24px;margin:20px 0 6px}
@media (max-width:700px){.hide-m{display:none}}
</style></head><body><div class="wrap">
<div class="top"><h1>👩‍🏫 Panell del mestre</h1><a class="back" href="index.html">🏠 Menu</a></div>
<div id="out"><div class="msg">⏳ Carregant…</div></div>
</div>
<script src="efauth.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=[],S=[],course='Tots',grp='Tots',days=0,view='students',sortK='stars',open=null;
const fmt=d=>new Date(d).toLocaleString('ca',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function load(){await EF.ready;
 if(!EF.user){$('#out').innerHTML=`<div class="msg">🔑 Inicia sessió amb el teu compte de mestre.<br><br><button class="btn" onclick="EF.login()">Inicia sessió amb Google</button></div>`;return}
 if(!await EF.isTeacher()){$('#out').innerHTML=`<div class="msg">⛔ Aquest compte (${esc(EF.user.email)}) no és de mestre.</div>`;return}
 const [a,b]=await Promise.all([EF.sb.from('profiles').select('*').limit(5000),EF.sb.from('scores').select('*').order('created_at',{ascending:false}).limit(20000)]);
 P=a.data||[];S=b.data||[];draw()}
function seg(id,opts,cur,cb){return `<div class="seg" id="${id}">${opts.map(o=>`<button data-v="${o[0]}" class="${String(o[0])===String(cur)?'on':''}">${o[1]}</button>`).join('')}</div>`}
function draw(){
 const since=days?Date.now()-days*864e5:0;
 const prof=P.filter(p=>(course==='Tots'||p.course===course)&&(grp==='Tots'||p.grp===grp));const ids=new Set(prof.map(p=>p.id));
 const sc=S.filter(s=>ids.has(s.user_id)&&new Date(s.created_at).getTime()>=since);
 let h=`<div class="bar">${seg('vw',[['students','👥 Alumnes'],['games','🎮 Jocs'],['feed','🕒 Activitat']],view)}${seg('co',[['Tots','Tots'],['3r','3r'],['4t','4t'],['5è','5è'],['6è','6è']],course)}${seg('gr',[['Tots','Tots els grups'],['A','A'],['B','B'],['C','C'],['D','D']],grp)}${seg('dy',[[7,'7 dies'],[30,'30 dies'],[0,'Sempre']],days)}<button class="btn" id="csv">⬇️ Excel (CSV)</button><button class="btn" id="rf" style="background:#fff">🔄</button></div>`;
 const act=new Set(sc.map(s=>s.user_id));
 h+=`<div class="cards"><div class="card">${prof.length}<small>alumnes registrats</small></div><div class="card">${act.size}<small>alumnes que han jugat</small></div><div class="card">${sc.length}<small>partides</small></div><div class="card">${sc.length?(sc.reduce((a,b)=>a+b.stars,0)/sc.length).toFixed(1):'–'} ⭐<small>mitjana d’estrelles</small></div></div>`;
 if(view==='students'){
  const rows=prof.map(p=>{const m=sc.filter(s=>s.user_id===p.id);const best={};m.forEach(s=>best[s.game]=Math.max(best[s.game]||0,s.stars));const st=Object.values(best).reduce((a,b)=>a+b,0);
   return {p,plays:m.length,games:Object.keys(best).length,stars:st,avg:m.length?m.reduce((a,b)=>a+b.stars,0)/m.length:0,last:m[0]?m[0].created_at:null,m}});
  rows.sort((a,b)=>sortK==='name'?a.p.nickname.localeCompare(b.p.nickname):sortK==='last'?((b.last||'')>(a.last||'')?1:-1):(b[sortK]-a[sortK]));
  h+=`<table><tr><th data-k="name">Alumne</th><th>Curs</th><th class="hide-m">Correu</th><th data-k="stars">⭐ Millors</th><th data-k="games">Jocs</th><th data-k="plays">Partides</th><th data-k="avg">Mitjana</th><th data-k="last">Últim cop</th></tr>`;
  rows.forEach(r=>{h+=`<tr class="cl" data-id="${r.p.id}"><td>${r.p.avatar} ${esc(r.p.nickname)}</td><td>${r.p.course} ${r.p.grp}</td><td class="hide-m muted">${esc(r.p.email)}</td><td class="st">⭐ ${r.stars}</td><td>${r.games}</td><td>${r.plays}</td><td>${r.avg.toFixed(1)}</td><td class="muted">${r.last?fmt(r.last):'—'}</td></tr>`;
   if(open===r.p.id){const g={};r.m.forEach(s=>{(g[s.game]=g[s.game]||[]).push(s)});h+=`<tr><td colspan="8" style="background:#f6f4ff"><div class="det"><h3>${r.p.avatar} ${esc(r.p.nickname)}</h3>${Object.keys(g).length?`<table>${Object.entries(g).map(([k,v])=>`<tr><td>${esc(v[0].title||k)} <span class="muted">${v[0].course} · ${v[0].unit}</span></td><td class="st">${'⭐'.repeat(Math.max(...v.map(x=>x.stars)))}</td><td>${v.length} partides</td><td class="muted">${v.map(x=>'⭐'+x.stars).slice(0,10).join(' ')}</td></tr>`).join('')}</table>`:'<p class="muted">Encara no ha jugat.</p>'}</div></td></tr>`}});
  h+='</table>';if(!rows.length)h+='<div class="msg">Encara no hi ha alumnes registrats en aquest grup.</div>'}
 if(view==='games'){const g={};sc.forEach(s=>{(g[s.game]=g[s.game]||{t:s.title,c:s.course,u:s.unit,n:0,st:0,us:new Set()});g[s.game].n++;g[s.game].st+=s.stars;g[s.game].us.add(s.user_id)});
  h+=`<table><tr><th>Joc</th><th>Curs · Unitat</th><th>Partides</th><th>Alumnes</th><th>Mitjana ⭐</th></tr>${Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(v.t||k)}</td><td>${v.c} · ${v.u}</td><td>${v.n}</td><td>${v.us.size}</td><td class="st">${(v.st/v.n).toFixed(1)}</td></tr>`).join('')}</table>`;if(!Object.keys(g).length)h+='<div class="msg">Encara no hi ha partides.</div>'}
 if(view==='feed'){const pm=Object.fromEntries(P.map(p=>[p.id,p]));h+=`<table><tr><th>Quan</th><th>Alumne</th><th>Joc</th><th>⭐</th><th>Punts</th></tr>${sc.slice(0,300).map(s=>`<tr><td class="muted">${fmt(s.created_at)}</td><td>${pm[s.user_id]?pm[s.user_id].avatar+' '+esc(pm[s.user_id].nickname)+' <span class="muted">'+pm[s.user_id].course+' '+pm[s.user_id].grp+'</span>':''}</td><td>${esc(s.title||s.game)}</td><td class="st">${'⭐'.repeat(s.stars)}</td><td>${s.points}</td></tr>`).join('')}</table>`}
 $('#out').innerHTML=h;
 const on=(id,cb)=>$$('#'+id+' button').forEach(b=>b.onclick=()=>{cb(b.dataset.v);draw()});
 on('vw',v=>view=v);on('co',v=>course=v);on('gr',v=>grp=v);on('dy',v=>days=+v);
 $$('th[data-k]').forEach(t=>t.onclick=()=>{sortK=t.dataset.k;draw()});
 $$('tr.cl').forEach(t=>t.onclick=()=>{open=open===t.dataset.id?null:t.dataset.id;draw()});
 $('#rf').onclick=load;
 $('#csv').onclick=()=>{const pm=Object.fromEntries(P.map(p=>[p.id,p]));const L=[['data','alumne','correu','curs','grup','joc','curs_joc','unitat','estrelles','punts']].concat(sc.map(s=>{const p=pm[s.user_id]||{};return [s.created_at,p.nickname,p.email,p.course,p.grp,s.title||s.game,s.course,s.unit,s.stars,s.points]}));
  const csv='﻿'+L.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='resultats-english-fedac.csv';a.click()};
}
EF.onChange(load);load();
</script></body></html>
