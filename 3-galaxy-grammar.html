<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Galaxy Grammar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#070821;--ink:#e8f1ff;--neon:#3ef0ff;--pink:#ff4fd8;--yellow:#ffd23f;--green:#4dff7a;--red:#ff4d5e;--panel:#11143a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#070821}
body{font-family:'VT323',monospace;color:var(--ink);min-height:100vh;padding:12px 16px;overflow-x:hidden;background:radial-gradient(ellipse at 50% -20%,#2a1d6b 0%,#070821 60%)}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(16px,3.4vw,28px);color:var(--yellow);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #000;line-height:1.3}
h1 small{display:block;font-size:.4em;color:var(--neon);text-shadow:none;margin-top:6px}
.missions{display:flex;flex-wrap:wrap;gap:6px}
.missions button{font-family:'Press Start 2P',monospace;font-size:10px;background:var(--panel);color:var(--ink);border:3px solid var(--neon);padding:8px 10px;cursor:pointer;box-shadow:4px 4px 0 #000}
.missions button.on{background:var(--neon);color:#000}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:'Press Start 2P',monospace;font-size:12px;margin-bottom:8px}
.hud div{background:var(--panel);border:3px solid #2b3270;padding:8px 10px;box-shadow:4px 4px 0 #000}
.hud b{color:var(--yellow)}
.q{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#1a1f55,#11143a);border:3px solid var(--pink);padding:10px 14px;margin-bottom:8px;box-shadow:4px 4px 0 #000;min-height:84px}
.q img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(62,240,255,.6))}
.q .t{font-size:clamp(24px,4vw,36px);line-height:1.05}
.q .t .blank{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--yellow);color:var(--yellow);text-align:center}
.q .t .hint{color:var(--neon);font-size:.8em}
.q .lbl{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--pink);display:block;margin-bottom:6px}
.stage{position:relative;border:3px solid var(--neon);box-shadow:0 0 0 3px #000,0 0 30px rgba(62,240,255,.35);background:#000}
canvas#g{display:block;width:100%;height:clamp(340px,58vh,560px);cursor:crosshair;touch-action:manipulation}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(7,8,33,.86);padding:20px;gap:14px}
.ov.hide{display:none}
.ov h2{font-family:'Press Start 2P',monospace;color:var(--yellow);font-size:clamp(16px,3vw,24px);line-height:1.5;text-shadow:3px 3px 0 var(--pink)}
.ov p{font-size:clamp(20px,3vw,28px);max-width:620px;line-height:1.1}
.ov img{width:90px;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.btn{font-family:'Press Start 2P',monospace;font-size:14px;background:var(--yellow);color:#000;border:0;padding:14px 20px;cursor:pointer;box-shadow:5px 5px 0 var(--pink),9px 9px 0 #000}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--pink)}
.help{text-align:center;color:#8f9ad8;margin-top:10px;font-size:19px}
kbd{font-family:'Press Start 2P';font-size:10px;background:#222a66;padding:2px 5px;border:2px solid #4450a0}
</style>
<div class="wrap">
 <header>
  <h1>GALAXY GRAMMAR<small>UNIT 1 · CHATTING WITH MY FRIENDS</small></h1>
  <div class="missions" id="missions">
   <button data-m="0" class="on">1 TECH</button><button data-m="1">2 MINE/YOURS</button><button data-m="2">3 TO + VERB</button>
  </div>
 </header>
 <div class="hud"><div>SCORE <b id="score">0</b></div><div>WAVE <b id="wave">1/10</b></div><div>COMBO <b id="combo">x1</b></div><div id="hearts">❤️❤️❤️</div></div>
 <div class="q" id="q"><img id="qimg" alt=""><div><span class="lbl" id="qlbl">MISSION</span><div class="t" id="qt">Press START</div></div></div>
 <div class="stage">
  <canvas id="g"></canvas>
  <div class="ov" id="ov"></div>
 </div>
 <p class="help">Tap / click the correct asteroid to shoot it 🔫 · or press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> · Shoot the 👽 UFO for bonus points!</p>
</div>

const TECH=[[3,'laptop'],[4,'headphones'],[5,'webcam'],[6,'tablet'],[7,'memory stick'],[8,'mobile phone']];
const EXTRA=['password','avatar','emoji','email address','spaceship','comet','keyboard','printer'];
const P=[{s:'I',e:'🙋',adj:'my',pr:'mine',ob:'me'},{s:'you',e:'👉',adj:'your',pr:'yours',ob:'you'},{s:'he',e:'👦',adj:'his',pr:'his',ob:'him'},{s:'she',e:'👧',adj:'her',pr:'hers',ob:'her'},{s:'we',e:'👫',adj:'our',pr:'ours',ob:'us'},{s:'they',e:'👨‍👩‍👧',adj:'their',pr:'theirs',ob:'them'}];
const PURP=[[4,'I use my headphones','to listen to music'],[5,'I use the webcam','to see my friends'],[7,'I use a memory stick','to save my files'],[3,'I use my laptop','to write emails'],[8,'I use my mobile phone','to call my grandma'],[6,'I use my tablet','to read e-books'],[3,'She uses the laptop','to do her homework'],[8,'He uses his phone','to send emojis'],[4,'We use headphones','to listen to podcasts'],[5,'They use a webcam','to talk to their cousins']];

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

function makeQ(m){
 if(m===0){const [i,w]=pick(TECH);const wrong=shuffle([...TECH.filter(t=>t[1]!==w).map(t=>t[1]),...EXTRA]).slice(0,3);
  return {img:i,lbl:'SCAN THE OBJECT',html:w==='headphones'?`What are these? They are <span class="blank">?</span>`:`What is this? It is a <span class="blank">?</span>`,ans:w,opts:shuffle([w,...wrong]),say:w==='headphones'?"They are headphones.":`It is a ${w}.`}}
 if(m===1){const p=pick(P),[i,obj]=pick(TECH),useAdj=Math.random()<.5;
  const ans=useAdj?p.adj:p.pr;const others=useAdj?[p.pr,p.ob]:[p.adj,p.ob];
  let opts=[...new Set([ans,...others])];while(opts.length<3){const x=pick(P);const c=pick([x.adj,x.pr]);if(!opts.includes(c)&&c!==ans)opts.push(c)}
  const pl=obj==='headphones',its=pl?"They are":"It is",be=pl?'are':'is';
  const html=useAdj?`${its} <span class="blank">?</span> ${obj}. <span class="hint">(${p.e} ${p.s})</span>`:`The ${obj} ${be} <span class="blank">?</span> <span class="hint">(${p.e} ${p.s})</span>`;
  const sent=useAdj?`${its} ${ans} ${obj}.`:`The ${obj} ${be} ${ans}.`;
  return {img:i,lbl:useAdj?'POSSESSIVE ADJECTIVE + NOUN':'POSSESSIVE PRONOUN (NO NOUN!)',html,ans,opts:shuffle(opts),say:sent}}
 const [i,start,ans]=pick(PURP);const verb=ans.replace(/^to /,'');const ing=verb.split(' ')[0];
 const ingForm=ing.endsWith('e')&&ing!=='see'?ing.slice(0,-1)+'ing':ing+'ing';
 const meaning=pick(PURP.filter(p=>p[2]!==ans&&p[0]!==i))[2];
 const opts=shuffle([ans,'for '+verb,ingForm+' '+verb.split(' ').slice(1).join(' '),meaning]);
 return {img:i,lbl:'WHY? → TO + VERB',html:`${start} <span class="blank">?</span>`,ans,opts,say:`${start} ${ans}.`}
}

addEventListener('resize',rs);rs();
const stars=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),z:Math.random()*3+.5}));
let mission=0,state='menu',score=0,combo=1,lives=3,wave=0,Q=null,rocks=[],parts=[],lasers=[],ufo=null,shipA=0,lastT=0,shake=0,flash=null,lock=0;
let ac;function tone(f,d=.1,v=.07,w=0,type='square',f2){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+w);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+w+d);g.gain.setValueAtTime(v,ac.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+w+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d)}catch(e){}}
const sLaser=()=>tone(1200,.15,.05,0,'square',200),sBoom=()=>tone(160,.35,.12,0,'sawtooth',40),sGood=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.09,.06,i*.06)),sBad=()=>tone(300,.4,.08,0,'square',60),sWin=()=>[523,659,784,1046,1318,1046,1318].forEach((f,i)=>tone(f,.14,.07,i*.11));
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const speed=()=>(H/(15-Math.min(6,wave*.6)))*(mission===2?.75:1);

function hud(){$('#score').textContent=score;$('#wave').textContent=Math.min(wave,10)+'/10';$('#combo').textContent='x'+combo;$('#hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function overlay(html){const o=$('#ov');o.innerHTML=html;o.classList.toggle('hide',!html)}
function menu(){
 state='menu';rocks=[];const names=['TECH WORDS','MINE · YOURS · HIS · HERS','TO + VERB (PURPOSE)'];
 const desc=['Scan the object and shoot the correct word!','my/your/his/her/our/their + noun… or mine/yours/his/hers/ours/theirs alone!','Why do we use it? Shoot the correct purpose: I use headphones TO listen to music.'];
 $('#qimg').src=SPR[2];$('#qlbl').textContent='MISSION '+(mission+1);$('#qt').innerHTML=names[mission];
 overlay(`<img src="${SPR[0]}"><h2>MISSION ${mission+1}<br>${names[mission]}</h2><p>${desc[mission]}</p><button class="btn" id="start">▶ START</button>`);
 $('#start').onclick=start;hud();
}
function start(){score=0;combo=1;lives=3;wave=0;overlay('');state='play';nextWave()}
function nextWave(){
 if(wave>=10)return win();
 wave++;Q=makeQ(mission);hud();
 $('#qimg').src=SPR[Q.img];$('#qlbl').textContent=Q.lbl;$('#qt').innerHTML=Q.html;
 const n=Q.opts.length,lanes=(W<640&&n>2)?2:n,lane=W/lanes;
 rocks=Q.opts.map((t,k)=>({t,k,lanes,x:lane*(k%lanes+.5)+(Math.random()-.5)*lane*.2,y:-40-Math.floor(k/lanes)*150-Math.random()*50,r:Math.max(26,Math.min(44,W/22)),rot:Math.random()*6,vr:(Math.random()-.5)*1.5,alive:true,ok:t===Q.ans}));
 lock=0;
}
function shoot(rk){
 if(state!=='play'||lock||!rk||!rk.alive)return;
 const sx=W/2,sy=H-50;shipA=Math.atan2(rk.y-sy,rk.x-sx)+Math.PI/2;sLaser();
 lasers.push({x1:sx,y1:sy-20,x2:rk.x,y2:rk.y,l:12});
 explode(rk.x,rk.y,rk.ok?'#4dff7a':'#ff4d5e',28);rk.alive=false;sBoom();
 if(rk.ok){lock=1;score+=100*combo;combo=Math.min(5,combo+1);sGood();say(Q.say);
  $('#qt').innerHTML=Q.html.replace(/<span class="blank">\?<\/span>/,`<span class="blank" style="color:var(--green)">${Q.ans}</span>`);
  flash={t:'✔ '+Q.ans.toUpperCase(),c:'#4dff7a',l:60};
  rocks.forEach(r=>{if(r.alive){explode(r.x,r.y,'#ffd23f',14);r.alive=false}});
  setTimeout(nextWave,1500)}
 else{combo=1;hit('✘ '+rk.t.toUpperCase())}
 hud();
}
function hit(msg){lives--;shake=14;sBad();flash={t:msg,c:'#ff4d5e',l:60};hud();if(lives<=0){lock=1;setTimeout(lose,900)}}
function explode(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*5+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30+Math.random()*25,c,s:Math.random()*4+2})}}
function lose(){state='over';overlay(`<img src="${SPR[1]}"><h2>GAME OVER</h2><p>Score: ${score}<br>The answer was: <b style="color:var(--yellow)">${Q.say}</b></p><button class="btn" id="re">↻ TRY AGAIN</button>`);$('#re').onclick=start}
function win(){state='win';sWin();const rank=score>=3000?'⭐⭐⭐ SPACE CAPTAIN':score>=1800?'⭐⭐ PILOT':'⭐ CADET';
 overlay(`<img src="${SPR[2]}"><h2>MISSION COMPLETE!</h2><p>Score: <b style="color:var(--yellow)">${score}</b><br>${rank}</p><button class="btn" id="re">↻ PLAY AGAIN</button>${mission<2?'<button class="btn" id="nx">NEXT MISSION ▶</button>':''}`);
 $('#re').onclick=start;const nx=$('#nx');if(nx)nx.onclick=()=>{setMission(mission+1);start()};for(let i=0;i<8;i++)setTimeout(()=>explode(Math.random()*W,Math.random()*H*.7,pick(['#ffd23f','#3ef0ff','#ff4fd8','#4dff7a']),40),i*200)}

function rockAt(x,y){let best=null,d=1e9;rocks.forEach(r=>{if(!r.alive)return;const dd=Math.hypot(r.x-x,(r.y+r.r*.6)-y);if(dd<r.r*1.9&&dd<d){d=dd;best=r}});return best}
cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
 if(ufo&&Math.hypot(ufo.x-x,ufo.y-y)<40&&state==='play'){explode(ufo.x,ufo.y,'#ff4fd8',40);sBoom();sGood();score+=250;flash={t:'+250 UFO!',c:'#ff4fd8',l:50};lasers.push({x1:W/2,y1:H-70,x2:ufo.x,y2:ufo.y,l:12});ufo=null;hud();return}
 shoot(rockAt(x,y))});
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=4&&state==='play'){const r=rocks.find(r=>r.k===n-1);shoot(r)}});
function setMission(m){mission=m;document.querySelectorAll('#missions button').forEach(b=>b.classList.toggle('on',+b.dataset.m===m))}
document.querySelectorAll('#missions button').forEach(b=>b.onclick=()=>{setMission(+b.dataset.m);menu()});

function wrapLines(t,maxW){cx.font=fontLbl();const w=t.split(' ');const L=[];let cur='';w.forEach(x=>{const tr=cur?cur+' '+x:x;if(cx.measureText(tr).width>maxW&&cur){L.push(cur);cur=x}else cur=tr});L.push(cur);return L}
const fontLbl=()=>`${W<500?9:12}px "Press Start 2P", monospace`;
function frame(t){
 const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
 cx.save();if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
 cx.fillStyle='#03041a';cx.fillRect(-20,-20,W+40,H+40);
 // planets
 cx.fillStyle='#2a1d6b';cx.beginPath();cx.arc(W*.85,H*.18,40,0,7);cx.fill();cx.fillStyle='#3b2a8f';cx.beginPath();cx.arc(W*.85-8,H*.18-8,30,0,7);cx.fill();
 cx.fillStyle='#123b5c';cx.beginPath();cx.arc(W*.08,H*.8,70,0,7);cx.fill();
 stars.forEach(s=>{s.y+=s.z*dt*.04;if(s.y>1)s.y=0;cx.fillStyle=s.z>2.5?'#fff':'#7d86c9';const z=Math.round(s.z);cx.fillRect(Math.round(s.x*W),Math.round(s.y*H),z,z)});
 // ufo
 if(state==='play'&&!ufo&&Math.random()<.0015)ufo={x:-50,y:40+Math.random()*60,v:90+Math.random()*60};
 if(ufo){ufo.x+=ufo.v*dt;ufo.y+=Math.sin(t/300)*.6;cx.drawImage(IM[2],ufo.x-34,ufo.y-26,68,52);if(ufo.x>W+60)ufo=null}
 // rocks
 cx.font=fontLbl();cx.textAlign='center';cx.textBaseline='middle';
 rocks.forEach(r=>{if(!r.alive)return;if(state==='play'&&!lock)r.y+=speed()*dt;r.rot+=r.vr*dt;
  cx.save();cx.translate(r.x,r.y);cx.rotate(r.rot);cx.drawImage(IM[1],-r.r,-r.r,r.r*2,r.r*2);cx.restore();
  const lines=wrapLines(r.t,Math.min(170,W/r.lanes-16));const lh=W<500?14:18,bw=Math.max(...lines.map(l=>cx.measureText(l).width))+16,bh=lines.length*lh+10,by=r.y+r.r+4;
  const lx=Math.max(bw/2+2,Math.min(W-bw/2-2,r.x));cx.fillStyle='rgba(0,0,0,.8)';cx.fillRect(lx-bw/2,by,bw,bh);cx.strokeStyle='#3ef0ff';cx.lineWidth=2;cx.strokeRect(lx-bw/2,by,bw,bh);
  cx.fillStyle='#fff';lines.forEach((l,i)=>cx.fillText(l,lx,by+lh/2+5+i*lh+1));
  cx.fillStyle='#ffd23f';cx.fillText(r.k+1,r.x,r.y-r.r-10);
  if(state==='play'&&!lock&&r.y>H-60){r.alive=false;explode(r.x,H-40,'#ff4d5e',20);if(r.ok){lock=1;hit('MISSED!');$('#qt').innerHTML=Q.html.replace(/<span class="blank">\?<\/span>/,`<span class="blank" style="color:var(--red)">${Q.ans}</span>`);say(Q.say);rocks.forEach(o=>o.alive=false);if(lives>0)setTimeout(nextWave,1800)}}
 });
 // lasers
 lasers=lasers.filter(l=>l.l-->0);lasers.forEach(l=>{cx.strokeStyle=`rgba(62,240,255,${l.l/12})`;cx.lineWidth=6;cx.beginPath();cx.moveTo(l.x1,l.y1);cx.lineTo(l.x2,l.y2);cx.stroke();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke()});
 // ship
 shipA*=.92;cx.save();cx.translate(W/2,H-50);cx.rotate(shipA);const sw=Math.min(80,W/7);cx.drawImage(IM[0],-sw/2,-sw/2,sw,sw);cx.restore();
 // particles
 parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});
 if(flash&&flash.l-->0){cx.font=`${W<500?14:22}px "Press Start 2P", monospace`;cx.fillStyle='#000';cx.fillText(flash.t,W/2+3,H/2+3);cx.fillStyle=flash.c;cx.fillText(flash.t,W/2,H/2)}
 cx.restore();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);menu();
</script>
