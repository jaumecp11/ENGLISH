<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Countryside Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#24324a;--grass:#7cc95a;--grass2:#4ea444;--sky:#bfe9ff;--path:#f6e7c1;--wood:#a8692f;--card:#fffdf6;--good:#22b35b;--bad:#e5484d;
--t-place:#ffe08a;--t-compare:#9fd3ff;--t-super:#ffb4d2;--t-people:#c7b5ff;--t-dialog:#a8f0cf;--t-special:#ff9f5a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:linear-gradient(180deg,var(--sky) 0,#dff5ff 160px,var(--grass) 161px,var(--grass2) 100%) fixed #7cc95a;min-height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:14px 16px 30px;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
h1{font-size:clamp(26px,4.6vw,44px);color:#2d6a1f;text-shadow:0 3px 0 #fff,0 6px 12px rgba(0,0,0,.15);line-height:1}
h1 small{display:block;font-size:.4em;color:var(--ink);text-shadow:none;margin-top:6px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600}
.legend span{background:#fff;border-radius:999px;padding:3px 10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.game{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:repeating-linear-gradient(90deg,#5aa94a 0 40px,#62b352 40px 80px);padding:12px;border-radius:24px;border:6px solid var(--wood);box-shadow:0 8px 0 #6b3d14,0 18px 40px rgba(0,0,0,.25);position:relative}
.sq{position:relative;aspect-ratio:1;border-radius:16px;background:var(--path);box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;border:3px solid #fff}
.sq .num{position:absolute;top:3px;left:6px;font-size:12px;font-weight:700;opacity:.6;z-index:2;background:rgba(255,255,255,.7);border-radius:6px;padding:0 4px}
.sq .ic{font-size:clamp(20px,3vw,34px);line-height:1}
.sq .lab{font-size:clamp(9px,1.1vw,12px);font-weight:700;text-align:center;line-height:1.05;margin-top:2px;padding:0 3px}
.sq.place{background:var(--t-place) center/cover}.sq.place .lab{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);padding:2px}
.sq.compare{background:var(--t-compare)}.sq.super{background:var(--t-super)}.sq.people{background:var(--t-people)}.sq.dialog{background:var(--t-dialog)}.sq.special{background:var(--t-special)}
.sq.start{background:#fff}.sq.finish{background:linear-gradient(135deg,#ffd84d,#ff9f1c)}
.pawns{position:absolute;inset:auto 2px 2px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;z-index:3}
.pawn{width:clamp(20px,2.8vw,32px);height:clamp(20px,2.8vw,32px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,1.8vw,20px);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .2s}
.pawn.jump{animation:jump .3s}
@keyframes jump{50%{transform:translateY(-14px) scale(1.15)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.panel{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.teams{display:flex;flex-direction:column;gap:6px}
.team{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;font-weight:700;border:3px solid transparent}
.team.cur{border-color:var(--ink);background:#fff7d6}
.team .sc{margin-left:auto;font-size:14px}
.dice{display:flex;flex-direction:column;align-items:center;gap:8px}
#die{width:96px;height:96px;border-radius:20px;background:#fff;box-shadow:0 6px 0 #c9c2ad,inset 0 -4px 0 #eee;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;cursor:pointer;border:0;transition:transform .2s}
#die i{width:16px;height:16px;border-radius:50%;background:var(--ink);place-self:center;opacity:0}
#die.roll{animation:roll .6s linear}
@keyframes roll{25%{transform:rotate(90deg) scale(.9)}50%{transform:rotate(180deg) scale(1.1)}75%{transform:rotate(270deg) scale(.9)}100%{transform:rotate(360deg)}}
.btn{font-family:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;background:#ffcf3f;color:var(--ink);box-shadow:0 5px 0 #c99a00}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a00}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:15px;text-align:center;font-weight:600;min-height:40px}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.show{display:flex}
.qcard{background:var(--card);border-radius:26px;max-width:560px;width:100%;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-height:94vh;overflow:auto}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.qcard .tag{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;margin-bottom:8px}
.qcard h2{font-size:clamp(20px,3.6vw,28px);line-height:1.2;margin-bottom:10px}
.qcard h2 .bl{display:inline-block;min-width:80px;border-bottom:3px dashed #999}
.qcard .imgs{display:flex;gap:10px;margin-bottom:10px}
.qcard .imgs figure{flex:1;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.qcard .imgs img{width:100%;display:block;aspect-ratio:1/0.75;object-fit:cover}
.qcard .imgs figcaption{position:absolute;bottom:6px;left:6px;background:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px}
.qcard .emo{font-size:60px;text-align:center}
.opts{display:grid;gap:8px}
.opt{font-family:inherit;font-size:clamp(16px,2.6vw,20px);font-weight:600;text-align:left;border:0;border-radius:14px;padding:10px 14px;background:#eef3ff;box-shadow:0 4px 0 #c8d4f2;cursor:pointer;color:var(--ink)}
.opt:hover{background:#e0e9ff}
.opt.ok{background:var(--good);color:#fff;box-shadow:0 4px 0 #157a3d}
.opt.no{background:var(--bad);color:#fff;box-shadow:0 4px 0 #9e2125}
.res{margin-top:10px;font-weight:700;font-size:18px;text-align:center}
.setup{text-align:center}
.setup h2{font-size:30px;margin-bottom:6px}
.setup .row{display:flex;gap:8px;justify-content:center;margin:14px 0}
.setup .row button{font-family:inherit;font-size:22px;font-weight:700;width:64px;height:64px;border-radius:16px;border:0;background:#eef3ff;cursor:pointer;box-shadow:0 4px 0 #c8d4f2}
.setup .row button.on{background:#ffcf3f;box-shadow:0 4px 0 #c99a00}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (max-width:820px){.game{grid-template-columns:1fr}.side{position:static;order:-1;flex-direction:row;flex-wrap:wrap}.side .panel{flex:1 1 200px}.board{grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}.sq{border-radius:10px;border-width:2px}.sq .lab{display:none}.sq.place .lab{display:none}#die{width:72px;height:72px;padding:9px}#die i{width:12px;height:12px}}
</style>
<canvas id="fx"></canvas>
<div class="wrap">
 <header>
  <h1>Countryside Quest 🏞️<small>Unit 2 · comparatives & superlatives · adjectives</small></h1>
  <div class="legend"><span>🖼️ Describe</span><span>⚖️ Compare</span><span>🏆 Superlative</span><span>😊 People</span><span>💬 Talk</span><span>⚠️ Surprise</span></div>
 </header>
 <div class="game">
  <div class="board" id="board"></div>
  <div class="side">
   <div class="panel"><div class="teams" id="teams"></div></div>
   <div class="panel dice"><button id="die" aria-label="Roll the dice"></button><button class="btn" id="roll">🎲 Roll!</button><div class="msg" id="msg"></div></div>
  </div>
 </div>
</div>
<div class="modal" id="modal"><div class="qcard" id="qc"></div></div>

 const Q=makeQ(s);
 const t=teams[cur];
 $('#qc').innerHTML=`<span class="tag" style="background:${Q.tag[1]}">${Q.tag[0]}</span> <span class="tag" style="background:${t.c};color:#fff">${t.e} ${t.n}</span>
 ${Q.imgs?`<div class="imgs">${Q.imgs.map(([i,n])=>`<figure><img src="${IMG[i]}" alt=""><figcaption>${n}</figcaption></figure>`).join('')}</div>`:''}
 ${Q.emo?`<div class="emo">${Q.emo}</div>`:''}<h2>${Q.q}</h2><div class="opts">${Q.opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="res" id="res"></div>`;
 $('#modal').classList.add('show');
 document.querySelectorAll('.opt').forEach(b=>b.onclick=async()=>{
  if(b.disabled)return;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.textContent===Q.ans;
  if(ok){b.classList.add('ok');sGood();t.pts++;burst(b);$('#res').innerHTML='✅ Correct! You stay here and win ⭐'}
  else{b.classList.add('no');sBad();[...document.querySelectorAll('.opt')].find(x=>x.textContent===Q.ans).classList.add('ok');$('#res').innerHTML=`❌ Oh no! Go back to square ${from}.`}
  say(Q.say);await wait(2300);$('#modal').classList.remove('show');
  if(!ok){t.pos=from;drawPawns()}endTurn();
 });
}
function endTurn(){cur=(cur+1)%teams.length;busy=false;$('#roll').disabled=false;drawPawns();$('#msg').textContent=`${teams[cur].e} ${teams[cur].n}: roll the dice!`}
function win(){const t=teams[cur];sWin();rain();drawPawns();
 const rank=[...teams].sort((a,b)=>b.pos-a.pos||b.pts-a.pts);
 $('#qc').innerHTML=`<div class="setup"><div style="font-size:70px">${t.e}🏆</div><h2>${t.n} win!</h2><p>${rank.map((x,i)=>`${['🥇','🥈','🥉','4️⃣'][i]} ${x.e} ${x.n} — ⭐${x.pts}`).join('<br>')}</p><br><button class="btn" id="again">Play again</button></div>`;
 $('#modal').classList.add('show');$('#again').onclick=setup;say(`The ${t.n} win! Congratulations!`)}
function setup(){
 let n=2;$('#qc').innerHTML=`<div class="setup"><div style="font-size:54px">🏞️🎲</div><h2>Countryside Quest</h2><p>Roll the dice, travel through the countryside and answer the cards. Right answer = stay + ⭐. Wrong answer = go back!</p><p style="margin-top:12px"><b>How many teams?</b></p><div class="row">${[1,2,3,4].map(k=>`<button data-n="${k}" class="${k===2?'on':''}">${k}</button>`).join('')}</div><button class="btn" id="go">Start ▶</button></div>`;
 $('#modal').classList.add('show');
 document.querySelectorAll('.setup .row button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.setup .row button').forEach(x=>x.classList.remove('on'));b.classList.add('on');n=+b.dataset.n});
 $('#go').onclick=()=>{teams=TEAMS.slice(0,n).map(t=>({...t,pos:0,pts:0}));cur=0;busy=false;$('#modal').classList.remove('show');drawBoard();showDie(6);$('#roll').disabled=false;$('#msg').textContent=`${teams[0].e} ${teams[0].n}: roll the dice!`};
}
$('#roll').onclick=roll;$('#die').onclick=roll;
// fx
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const COL=['#ffcf3f','#ff7a3d','#2fbf5a','#5ab8ff','#ff6fb1'];
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<30;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.9)*9,s:4+Math.random()*6,c:COL[i%5],l:60});loop()}
function rain(){for(let i=0;i<180;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,c:COL[i%5],l:240});loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.17;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});if(parts.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
teams=TEAMS.slice(0,2).map(t=>({...t,pos:0,pts:0}));drawBoard();showDie(6);setup();
</script>
