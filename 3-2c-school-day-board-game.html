<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School Day Board Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#6c4cf5;--c2:#ff5c8a;--acc:#ffcf3f;--ink:#26214a;--card:#fff;--soft:#f2efff;--good:#22b35b;--bad:#e5484d;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--c1)}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:12px 16px 30px;overflow-x:hidden;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.16) 0 70px,transparent 71px),radial-gradient(circle at 88% 78%,rgba(255,255,255,.12) 0 110px,transparent 111px),radial-gradient(circle at 70% 8%,rgba(255,255,255,.1) 0 40px,transparent 41px),linear-gradient(135deg,var(--c1),var(--c2)) fixed}
button{font-family:'Fredoka',sans-serif}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{color:#fff;font-size:clamp(24px,4.6vw,42px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.top h1 small{display:block;font-size:.4em;font-weight:600;opacity:.95;margin-top:5px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{border:0;color:#fff;font-weight:700;background:rgba(0,0,0,.2);padding:7px 13px;border-radius:999px;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.tb:hover{background:rgba(0,0,0,.32)}
.tb.learn{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tb.off{opacity:.55}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.panel{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.btn{font:700 19px 'Fredoka',sans-serif;border:0;border-radius:14px;padding:11px 22px;cursor:pointer;background:var(--acc);color:#3a2a00;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.opt{font:600 clamp(16px,2.4vw,20px) 'Fredoka',sans-serif;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;background:var(--soft);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12);text-align:center;transition:transform .1s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);background:#e7e1ff}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good)!important;color:#fff!important;animation:okp .4s}
.opt.no{background:var(--bad)!important;color:#fff!important;animation:shake .4s}
@keyframes okp{50%{transform:scale(1.05)}}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed #aaa;color:transparent}
.pic{display:block;width:100%;height:100%;object-fit:cover}
.emo{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:clamp(34px,6vw,70px);background:var(--soft)}
.modal{position:fixed;inset:0;background:rgba(20,15,45,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.mbox{background:var(--card);border-radius:26px;max-width:540px;width:100%;padding:22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-height:94vh;overflow:auto}
.mbox h2{font-size:clamp(24px,4vw,34px);margin:6px 0}
.mbox .big{font-size:64px;line-height:1}
.mbox p{font-size:18px;margin:6px 0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--card);padding:10px 22px;border-radius:16px;font-weight:700;font-size:clamp(18px,3vw,26px);box-shadow:0 8px 0 rgba(0,0,0,.2);transition:.35s;z-index:80;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.mascot{position:fixed;left:14px;bottom:14px;z-index:85;display:flex;align-items:flex-end;gap:6px;pointer-events:none;transform:translateY(140%);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mascot.show{transform:none}
.mascot .mf{font-size:clamp(46px,6vw,64px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.mascot .mb{background:#fff;border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:700;font-size:clamp(16px,2.2vw,20px);box-shadow:0 5px 0 rgba(0,0,0,.18);margin-bottom:34px;white-space:nowrap}
.mascot.good .mb{color:#15803d}.mascot.bad .mb{color:#b91c1c}
/* ---------- intro & theory ---------- */
.ov{position:fixed;inset:0;z-index:70;display:none;overflow:auto;padding:18px 14px 30px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ov.show{display:block}
.introbox{max-width:620px;margin:4vh auto 0;background:#fff;border-radius:30px;padding:26px 22px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.2);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.introbox .ie{font-size:76px;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.introbox h2{font-size:clamp(28px,5vw,40px);margin:8px 0 2px}
.introbox .is{color:#6b6790;font-weight:600;font-size:17px}
.how{text-align:left;margin:18px 0;display:grid;gap:10px}
.how div{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:18px;font-weight:600}
.how div b{font-size:28px;flex-shrink:0;width:36px;text-align:center}
.how div small{display:block;font-weight:500;color:#6b6790;font-size:14px}
.ibtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.ibtns .btn{font-size:21px;padding:14px 26px}
.ibtns .btn.learnb{background:#fff;color:var(--ink);border:3px solid var(--c1);box-shadow:0 5px 0 var(--c1)}
.th{max-width:980px;margin:0 auto}
.thhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;margin-bottom:14px}
.thhead h2{font-size:clamp(26px,4.6vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1.05}
.thhead h2 small{display:block;font-size:.45em;opacity:.95;font-weight:600}
.ttabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ttabs button{border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:17px;cursor:pointer;background:rgba(255,255,255,.3);color:#fff}
.ttabs button.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tsec{display:none}.tsec.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.vc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;border:0;padding:0;text-align:center;transition:transform .15s}
.vc:hover{transform:translateY(-4px) rotate(-1deg)}
.vc .vi{aspect-ratio:1/0.85;overflow:hidden}
.vc .vi .emo{font-size:58px}
.vc .vw{font-weight:700;font-size:19px;padding:7px 6px 2px;color:var(--ink)}
.vc .vca{font-size:14px;color:#8a86a8;padding-bottom:8px;min-height:22px}
.vc.play{outline:4px solid var(--acc)}
.gcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));align-items:start}
.gc{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.gc h3{font-size:clamp(20px,3vw,25px);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.gc .ca{background:#fff7d6;border-left:6px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:16px;margin:8px 0 12px;line-height:1.4}
.gc .ca b{color:#9a6b00}
.exs{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:9px 12px;font-size:clamp(17px,2.4vw,21px);font-weight:600;cursor:pointer;border:0;text-align:left;color:var(--ink);width:100%}
.ex:hover{background:#e7e1ff}
.ex .spk{font-size:20px;flex-shrink:0}
.ex mark{background:var(--acc);border-radius:6px;padding:0 4px;color:#3a2a00}
.ex .tr{display:block;font-size:14px;color:#8a86a8;font-weight:500}
.gtable{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(16px,2.3vw,20px);margin-top:4px}
.gtable td,.gtable th{padding:8px 10px;text-align:left}
.gtable th{font-size:14px;color:#6b6790;text-transform:uppercase;letter-spacing:.5px}
.gtable td{background:var(--soft);font-weight:600}
.gtable tr td:first-child{border-radius:12px 0 0 12px}.gtable tr td:last-child{border-radius:0 12px 12px 0}
.gtable mark{background:var(--acc);border-radius:6px;padding:0 4px}
.thfoot{text-align:center;margin-top:20px}
.qc{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.15);max-width:620px;margin:0 auto;text-align:center}
.qc h3{font-size:clamp(20px,3vw,26px);margin:8px 0 12px}
.qc .opts{display:grid;gap:8px}
.qcp{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.qcp i{width:14px;height:14px;border-radius:50%;background:#e4e0f5}.qcp i.ok{background:var(--good)}.qcp i.no{background:var(--bad)}
@media (max-width:600px){.vgrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.vc .vw{font-size:16px}.how div{font-size:16px}.tools .tb span{display:none}}
.game{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:rgba(255,255,255,.25);padding:12px;border-radius:24px;border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.sq{position:relative;aspect-ratio:1;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;border:3px solid #fff;background:#fff}
.sq .num{position:absolute;top:3px;left:6px;font-size:12px;font-weight:700;opacity:.6;z-index:2}
.sq .ic{font-size:clamp(20px,3vw,34px);line-height:1}
.sq .lab{font-size:clamp(9px,1.1vw,12px);font-weight:700;text-align:center;line-height:1.05;margin-top:2px;padding:0 3px}
.sq.pic .pic{position:absolute;inset:0}.sq.pic .ic{display:none}
.sq.start{background:#fff}.sq.finish{background:linear-gradient(135deg,#ffd84d,#ff9f1c)}.sq.special{background:#ff9f5a}
.pawns{position:absolute;inset:auto 2px 2px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;z-index:3}
.pawn{width:clamp(20px,2.8vw,32px);height:clamp(20px,2.8vw,32px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(13px,1.8vw,20px);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.pawn.jump{animation:jump .3s}
@keyframes jump{50%{transform:translateY(-14px) scale(1.15)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.team{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;font-weight:700;border:3px solid transparent}
.team.cur{border-color:var(--ink);background:#fff7d6}
.team .sc{margin-left:auto;font-size:14px}
.dice{display:flex;flex-direction:column;align-items:center;gap:8px}
#die{width:92px;height:92px;border-radius:20px;background:#fff;box-shadow:0 6px 0 #c9c2ad,inset 0 -4px 0 #eee;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;cursor:pointer;border:3px solid var(--soft)}
#die i{width:16px;height:16px;border-radius:50%;background:var(--ink);place-self:center;opacity:0}
#die.roll{animation:roll .6s linear}
@keyframes roll{25%{transform:rotate(90deg) scale(.9)}50%{transform:rotate(180deg) scale(1.1)}75%{transform:rotate(270deg) scale(.9)}100%{transform:rotate(360deg)}}
.msg{font-size:15px;text-align:center;font-weight:600;min-height:40px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.legend span{border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mbox .im{width:100%;max-width:300px;margin:0 auto 8px;aspect-ratio:1/0.75;border-radius:16px;overflow:hidden}
.mbox .im .emo{font-size:80px}
.mbox .tg{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;margin:2px}
.mbox h2 .blank{display:inline-block;min-width:70px;border-bottom:3px dashed #aaa;color:transparent}
.mbox .opts{display:grid;gap:8px;margin-top:10px}
.setup .row{display:flex;gap:8px;justify-content:center;margin:14px 0}
.setup .row button{font:700 22px 'Fredoka',sans-serif;width:60px;height:60px;border-radius:16px;border:0;background:var(--soft);cursor:pointer}
.setup .row button.on{background:var(--acc)}
@media (max-width:820px){.game{grid-template-columns:1fr}.side{position:static;order:-1;flex-direction:row;flex-wrap:wrap}.side .panel{flex:1 1 200px}.board{grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}.sq{border-radius:10px;border-width:2px}.sq .lab{display:none}#die{width:70px;height:70px;padding:9px}#die i{width:12px;height:12px}}
/*FILL*/
.game{grid-template-columns:1fr minmax(260px,300px);gap:20px}
.board{max-width:calc(var(--avh) * 1.2 - 30px);width:100%;margin:0 auto;gap:10px}
.sq .ic{font-size:clamp(24px,3.2vw,44px)}
.sq .lab{font-size:clamp(10px,1vw,14px)}
.sq .num{font-size:14px}
.legend span{font-size:16px;padding:6px 14px}
.team{font-size:20px;padding:10px}
#die{width:130px;height:130px;padding:16px}
#die i{width:22px;height:22px}
.msg{font-size:19px}
.side .panel{padding:18px}
.pawn{width:clamp(26px,3vw,38px);height:clamp(26px,3vw,38px);font-size:clamp(15px,2vw,24px)}
@media (max-width:820px){.board{max-width:100%}#die{width:76px;height:76px;padding:10px}#die i{width:13px;height:13px}}

/* ===== BIG UI ===== */
.wrap{max-width:1500px}
body{padding:10px 18px 18px}
.top{margin-bottom:10px}
.top h1{font-size:clamp(28px,3.6vw,46px)}
.top h1 small{font-size:.42em}
.tb{font-size:17px;padding:10px 16px}
.pill{font-size:clamp(17px,1.6vw,21px);padding:8px 18px}
.hud{gap:10px;margin-bottom:12px}
.btn{font-size:clamp(19px,1.8vw,24px);padding:14px 28px;border-radius:16px}
.opt{font-size:clamp(19px,2vw,28px);padding:16px 18px;border-radius:16px;min-height:62px}
.seg{display:flex;background:rgba(255,255,255,.92);border-radius:999px;padding:5px;box-shadow:0 4px 0 rgba(0,0,0,.15);gap:2px}
.seg button{font:700 clamp(15px,1.4vw,19px) 'Fredoka',sans-serif;border:0;background:transparent;padding:10px 18px;border-radius:999px;cursor:pointer;color:var(--ink);transition:.15s}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--c1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mbox{max-width:780px;padding:28px}
.mbox h2{font-size:clamp(26px,3.2vw,40px);line-height:1.2}
.mbox .opts{gap:12px!important}
.mbox .opt{font-size:clamp(20px,2.2vw,30px)}
.mbox .im{max-width:420px!important}
.mbox p{font-size:20px}
.panel{padding:20px;border-radius:24px}
:root{--avh:calc(100vh - 165px)}
@media (max-width:760px){:root{--avh:auto}.opt{min-height:52px}.btn{padding:12px 20px}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="wrap">
 <div class="top"><h1>🎲 My School Day Board Game<small>3r · Unit 2</small></h1>
  <div class="tools"><button class="tb learn" id="tLearn">📖 <span>Learn</span></button><button class="tb" id="tHow">❔ <span>How to play</span></button><button class="tb" id="tSnd" title="Sound">🔊</button><button class="tb" id="tVoice" title="Voice">🗣️</button><button class="tb" id="tFs" title="Full screen">⛶</button><a class="tb" href="index.html">🏠 <span>Menu</span></a></div></div>
 <div class="legend" id="legend"></div>
<div class="game">
 <div class="board" id="board"></div>
 <div class="side">

 </div>
</div>
</div>
<div class="ov" id="intro"><div class="introbox" id="introbox"></div></div>
<div class="ov" id="theory"><div class="th" id="th"></div></div>
<div class="toast" id="toast"></div>
<div class="mascot" id="mascot"><div class="mf" id="mf">🦉</div><div class="mb" id="mb"></div></div>

 const sel=t=>{$$('.ttabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('.tsec').forEach(s=>s.classList.toggle('on',s.id==='ts-'+t));if(t==='c')check(0,[])};
 $$('.ttabs button').forEach(b=>b.onclick=()=>{sClick();sel(b.dataset.t)});sel(tab||tabs[0][0]);
 $$('.vc').forEach(b=>b.onclick=()=>{$$('.vc').forEach(x=>x.classList.remove('play'));b.classList.add('play');say(T.vocab[+b.dataset.i].say||T.vocab[+b.dataset.i].w,1)});
 $$('.ex').forEach(b=>b.onclick=()=>say(b.dataset.s,1));
 let caOn=true;$('#caT').onclick=()=>{caOn=!caOn;$('#caT').textContent='🗨️ Català: '+(caOn?'ON':'OFF');$$('.ca-x').forEach(e=>e.style.display=caOn?'':'none')};
 $('#thPlay').onclick=$('#thPlay2').onclick=()=>{$('#theory').classList.remove('show');startGame()};
}
function check(i,res){const T=D.theory,C=T.check;const box=$('#qc');if(i>=C.length){const ok=res.filter(Boolean).length;box.innerHTML=`<div class="qcp">${res.map(r=>`<i class="${r?'ok':'no'}"></i>`).join('')}</div><div style="font-size:60px">${ok===C.length?'🌟':ok>=C.length/2?'👍':'💪'}</div><h3>${ok}/${C.length} correct!</h3><p>${ok===C.length?'Perfect! You are ready!':'Look at the grammar again or try the game!'}</p><br><button class="btn sec" id="qcr">🔄 Try again</button>`;$('#qcr').onclick=()=>check(0,[]);if(ok===C.length){sWin();burst(box,40)}return}
 const it=C[i];box.innerHTML=`<div class="qcp">${C.map((_,k)=>`<i class="${k<i?(res[k]?'ok':'no'):''}"></i>`).join('')}</div><p style="color:#6b6790;font-weight:600">Question ${i+1}/${C.length}</p>${it.img!=null?`<div style="width:130px;aspect-ratio:1;border-radius:16px;overflow:hidden;margin:6px auto">${picHTML(it.img)}</div>`:''}<h3>${qText(it)}</h3><div class="opts">${qOpts(it).map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
 $$('#qc .opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;$$('#qc .opt').forEach(x=>x.disabled=true);const ok=b.textContent===it.a;b.classList.add(ok?'ok':'no');if(!ok)$$('#qc .opt').find(x=>x.textContent===it.a).classList.add('ok');ok?sGood():sBad();say(qSay(it));res.push(ok);setTimeout(()=>check(i+1,res),1500)})}
function openIntro(){$('#introbox').innerHTML=`<div class="ie">${META.emoji}</div><h2>${META.title}</h2><div class="is">${META.sub}</div><div class="how">${HOW.map(h=>`<div><b>${h[0]}</b><span>${h[1]}${h[2]?`<small>${h[2]}</small>`:''}</span></div>`).join('')}</div><div class="ibtns">${D.theory?'<button class="btn learnb" id="iLearn">📖 Learn first</button>':''}<button class="btn" id="iPlay">▶ Let’s play!</button></div>`;
 $('#intro').classList.add('show');$('#iPlay').onclick=()=>{$('#intro').classList.remove('show');startGame()};const l=$('#iLearn');if(l)l.onclick=()=>openTheory()}
$('#tLearn').onclick=()=>openTheory();$('#tHow').onclick=()=>openIntro();
if(!D.theory)$('#tLearn').style.display='none';
let __started=false;function startGame(){try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}if(__started)return;__started=true;__GAME__()}
function __GAME__(){
const B=D.board;const N=B.squares||30;
const SPEC=B.specials||{6:{ic:'🚀',l:'Go forward 3!',mv:3},12:{ic:'🍌',l:'Oops! Go back 3',mv:-3},17:{ic:'🎁',l:'Roll again!',again:1},22:{ic:'🌀',l:'Go back 4!',mv:-4},26:{ic:'🛼',l:'Go forward 2!',mv:2}};
const sq=[];let ci=0;for(let i=0;i<N;i++){if(i===0)sq.push({t:'start'});else if(i===N-1)sq.push({t:'finish'});else if(SPEC[i])sq.push({t:'special',...SPEC[i]});else{const c=B.cats[ci++%B.cats.length];const it=c.squarePic?c.items[(ci)%c.items.length]:null;sq.push({t:'cat',c,pimg:it&&it.img,it})}}
const TEAMS=[{n:'Team A',e:'🦊',c:'#ff7a3d'},{n:'Team B',e:'🐻',c:'#8b5a2b'},{n:'Team C',e:'🐸',c:'#2fbf5a'},{n:'Team D',e:'🐥',c:'#ffc61a'}];
let teams=[],cur=0,busy=false;
$('#legend').innerHTML=B.cats.map(c=>`<span style="background:${c.color}">${c.ic} ${c.label}</span>`).join('')+'<span style="background:#ff9f5a">⚠️ Surprise</span>';
function cols(){return innerWidth<=820?5:6}
function drawBoard(){const C=cols(),b=$('#board');b.innerHTML='';
 for(let i=0;i<N;i++){const r=Math.floor(i/C),c=r%2?C-1-i%C:i%C,s=sq[i],d=document.createElement('div');d.className='sq '+s.t+(s.pimg!=null?' pic':'');d.id='sq'+i;d.style.gridRow=r+1;d.style.gridColumn=c+1;
  if(s.t==='cat'){d.style.background=s.c.color;d.innerHTML=(s.pimg!=null?picHTML(s.pimg):'')+`<span class="num">${i}</span><span class="ic">${s.c.ic}</span><span class="lab">${s.c.label}</span>`}
  else if(s.t==='special')d.innerHTML=`<span class="num">${i}</span><span class="ic">${s.ic}</span><span class="lab">${s.l}</span>`;
  else d.innerHTML=`<span class="num">${i}</span><span class="ic">${s.t==='start'?'🚩':'🏁'}</span><span class="lab">${s.t==='start'?'START':'FINISH'}</span>`;
  d.insertAdjacentHTML('beforeend','<div class="pawns"></div>');b.appendChild(d)}drawPawns()}
function drawPawns(){$$('.pawns').forEach(p=>p.innerHTML='');teams.forEach((t,k)=>{$('#sq'+t.pos+' .pawns').insertAdjacentHTML('beforeend',`<span class="pawn" id="pw${k}" style="background:${t.c}">${t.e}</span>`)});
 $('#teams').innerHTML=teams.map((t,k)=>`<div class="team ${k===cur?'cur':''}"><span class="pawn" style="background:${t.c}">${t.e}</span>${t.n}<span class="sc">⭐${t.pts} · 📍${t.pos}</span></div>`).join('')}
addEventListener('resize',()=>{if(teams.length)drawBoard()});
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function showDie(n){$('#die').innerHTML=[...Array(9)].map((_,i)=>`<i style="opacity:${PIPS[n].includes(i)?1:0}"></i>`).join('')}
async function roll(){if(busy||!teams.length)return;busy=true;const d=$('#die');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');
 for(let i=0;i<8;i++){showDie(1+Math.random()*6|0);tone(300+i*40,.04,.05);await wait(70)}
 const n=1+Math.random()*6|0;showDie(n);$('#msg').textContent=`${teams[cur].e} ${teams[cur].n} rolled ${n}!`;await wait(400);
 const from=teams[cur].pos;await move(n);if(teams[cur].pos>=N-1)return win();land(from)}
async function move(n){const t=teams[cur],dir=Math.sign(n);for(let i=0;i<Math.abs(n);i++){t.pos=Math.max(0,Math.min(N-1,t.pos+dir));drawPawns();$('#pw'+cur).classList.add('jump');tone(700,.06,.07);await wait(260);if(t.pos===N-1)break}}
async function land(from){const s=sq[teams[cur].pos];
 if(s.t==='special'){$('#msg').textContent=`${s.ic} ${s.l}`;tone(s.mv>0||s.again?880:220,.3,.1);await wait(900);if(s.mv){await move(s.mv);if(teams[cur].pos>=N-1)return win()}
  if(s.again){busy=false;$('#msg').textContent=`${teams[cur].e} roll again!`;return}return endTurn()}
 if(s.t==='start')return endTurn();ask(s.c,from,s.it)}
function ask(c,from,fixed){const it=fixed||pick(c.items),t=teams[cur];
 modal(`<span class="tg" style="background:${c.color}">${c.ic} ${c.label}</span><span class="tg" style="background:${t.c};color:#fff">${t.e} ${t.n}</span>${it.img!=null?`<div class="im">${picHTML(it.img)}</div>`:''}<h2>${qText(it)}</h2><div class="opts">${qOpts(it).map(o=>`<button class="opt">${o}</button>`).join('')}</div><p id="res"></p>`);
 if(it.listen)say(it.q);
 $$('.mbox .opt').forEach(b=>b.onclick=async()=>{if(b.disabled)return;$$('.mbox .opt').forEach(x=>x.disabled=true);const ok=b.textContent===it.a;
  if(ok){b.classList.add('ok');sGood();t.pts++;burst(b);$('#res').innerHTML='✅ Correct! Stay here and win ⭐'}
  else{b.classList.add('no');sBad();$$('.mbox .opt').find(x=>x.textContent===it.a).classList.add('ok');$('#res').innerHTML=`❌ Go back to square ${from}.`}
  say(qSay(it));await wait(2300);closeModal();if(!ok){t.pos=from;drawPawns()}endTurn()})}
function endTurn(){cur=(cur+1)%teams.length;busy=false;drawPawns();$('#msg').textContent=`${teams[cur].e} ${teams[cur].n}: roll the dice!`}
function win(){const t=teams[cur];drawPawns();const rank=[...teams].sort((a,b)=>b.pos-a.pos||b.pts-a.pts);
 endScreen(`${t.e} ${t.n} wins!`,rank.map((x,i)=>`${['🥇','🥈','🥉','4️⃣'][i]} ${x.e} ${x.n} — ⭐${x.pts}`),3,setup)}
function setup(){let n=2;modal(`<div class="setup"><div class="big">🎲</div><h2>${B.title||'Board game'}</h2><p>Roll the dice and answer the cards. Right answer = stay + ⭐. Wrong answer = go back!</p><p><b>How many teams?</b></p><div class="row">${[1,2,3,4].map(k=>`<button data-n="${k}" class="${k===2?'on':''}">${k}</button>`).join('')}</div><button class="btn" id="go">Start ▶</button></div>`);
 $$('.setup .row button').forEach(b=>b.onclick=()=>{$$('.setup .row button').forEach(x=>x.classList.remove('on'));b.classList.add('on');n=+b.dataset.n});
 $('#go').onclick=()=>{teams=TEAMS.slice(0,n).map(t=>({...t,pos:0,pts:0}));cur=0;busy=false;closeModal();drawBoard();showDie(6);$('#msg').textContent=`${teams[0].e} ${teams[0].n}: roll the dice!`}}
$('#roll').onclick=roll;$('#die').onclick=roll;
teams=TEAMS.slice(0,2).map(t=>({...t,pos:0,pts:0}));drawBoard();showDie(6);setup();
;window.__ev=s=>eval(s);
}
openIntro();
</script></body></html>
